e 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up：生产级优化（避免每次从 t=0 重算）。\n3. Social Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择、复活、胜率最大化。\n5. Toy Language / 类型推断——toString、泛型推断、函数签名。\n6. Text Editor——4 部分：buffer 增删\nding 汇总：prefix-product autog"}]},{"id":"design-slack","name":"设计 Slack","name_en":"Design Slack","category":"system-design","roles":["ds","mle","swe"],"stages":["OA","Phone Screen"],"heat":2,"runnable":false,"frequency":"low","snippets":[{"tid":1174423,"text":"和其他帖子一样，先是48小时完成一个关于free trial的takehome project，提交后2-3天进行电面。\n电面一共1小时:\n面试官全程严肃，时不时还回一下Slack消息，感觉有点不耐烦。\n感觉都答出来了，但是第二天依然收到拒信。\nczhang0727\n楼主好人一生平安!\nnishyyaobaozha\nRoblox PhD DS Intern面经\n开放爱店面\nQR Interview\nOpen AI 店面\n准备openai和anthropic面试\nUnited Airline OR Summer Intern Interview\nKikoff Grant DS 电面\nNvidia员工可以效仿OpenAI员工发起请愿留住老黄吗？\n啥时候跟HR说已入职新公司比较稳妥\nCapitalOne PD 新鲜挂经\nShopify Applied ML Engineer\n灵婴senior DS电面\n开放爱 过经 没HC 没拒 没冷冻\nOAI 电面 挂经 系统设计\nhinge Data Engineer面经\nMeta Produc"},{"tid":1152850,"text":"全strong\n4轮onsite 三轮strong 最后一轮sd被给了个估计weak hire\n加面了一轮sd来了个都不是常规sd的题 是个设计算法的 毫无系统设计考点然后被挂了（外国人sre 毫不懂sd）\n这次target L5（staff）\n最难受的是我遇到了几个年纪稍长的中国人coding bq毫不为难甚至有一轮三十多分钟做完就结束\n然后我挂在了一个不到五年经验的中国人sd手下\nsd考的是slack我一直有自己的结构他经常在不有趣的地方问我问题最后反馈的是我deepdive内容不够\n. ----\n我想起bq那轮中国manager皱着眉头疯狂做笔记 不停问我他笔记需要的信息的样子，最后给了strong hire真的非常感慨。\n国人为啥能放水的地方不放水，我在现司一直给国人strong hire，signal即使缺的我就补上，特别是sd这种最好办了。\n只怕是只有烙印铁拳打到自己才会有这等意识吧，本来面完非加面最后一轮感觉稳了，自己也准备好进oai努力放国人进来，甚是开心，然而这等想法戛然而止。\n我愿意以我祭旗，再次警醒下各位，放水必须要强推/近似强推（千万别写具体的area to improve）否则对于这个烙印们都无脑给stronghire的时代，只怕你身边真正的兄弟姐妹们会越来越少。\nGlucks.Wooer\nwxliuyi"}],"posts":[{"tid":1174423,"title":"OpenAI DS 店面挂经|openaiPM面经","chars":937,"floors":5,"roles":["ds","mle"],"stages":["OA","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1174423-1-1.html"},{"tid":1152850,"title":"短记openai无奈面试|openai求职讨论","chars":2486,"floors":31,"roles":["swe"],"stages":["Behavior ons 榜单（213 题，带频率和最近出题日期）。题库比 Harvey 大得多，但高频题依然集中。\n一、流程概览\n- Recruiter/HR call：聊背景和期望，注意——这一轮会问你对 AGI/AI safety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up：生产级优化（避免每次从 t=0 重算）。\n3. Social Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择、复活、胜率最大化。\n5. Toy Language / 类型推断——toString、泛型推断、函数签名。\n6. Text Editor——4 部分：buffer 增删\nding 汇总：prefix-product autog"}]},{"id":"oa-microorganism-simulation","name":"OA: 微生物模拟","name_en":"OA: Microorganism Simulation","category":"coding","roles":["swe"],"stages":["OA"],"heat":1,"runnable":true,"frequency":"single","snippets":[{"tid":1192185,"text":"Question 3 — Microorganism Simulation\nObjective\nSeveral microorganisms of different families have been arranged next to each other.\nKnowing that a microorganism eats its neighbor if it is of a different family and smaller in size, write a program that returns the largest family and its size when the situation reaches an equilibrium. Process\nEach microorganism belongs to a family, defined\nts family, a separation space and its size.\nThe tests are designed so that at the end of the simulation there is always only one microorganism with t"}],"posts":[{"tid":1192185,"title":"OPEN AI NEW GRAD SWE OA Q3|openai面经","chars":1226,"floors":1,"roles":["swe"],"stages":["OA"],"url":"https://www.1point3acres.com/bbs/thread-1192185-1-1.html"}],"answer":[{"tid":1192185,"text":"Question 3 — Microorganism Simulation\nObjective\nSeveral microorganisms of different families have been arranged next to each other.\nKnowing that a microorganism eats its neighbor if it is of a different family and smaller in size, write a program that returns the largest family and its size when the situation reaches an equilibrium. Process\nEach microorganism belongs to a family, defined\nts family, a separation space and its size.\nThe tests are designed so that at the end of the simulation there is always only one microorganism with the maximum size.\nThe maximum number of microorganisms given as input is 20.\nweibest\n回复发表中... ';\nsbtn.setAttribute('background', sbtn.style.background);\nsbtn.setAttribute('bordercolor', sbtn.style.borderColor);\nsbtn.style.background = '#C7C7C7';\nsbtn.style.borderColor = '#8B8B8B';\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\nThe PIP I am Going Through\n用项目管理的方式找承包商\nVIP通行证"}]},{"id":"opensheet-spreadsheet","name":"OpenSheet 电子表格","name_en":"OpenSheet Spreadsheet","category":"coding","roles":["mle"],"stages":["OA","Onsite"],"heat":1,"runnable":true,"frequency":"single","snippets":[{"tid":1190142,"text":"如果你在准备 AI 公司（特别是 OpenAI、Harvey 这类）的面试，这道题你大概率会遇到：设计一个支持公式的电子表格。setCell/getCell、公式求值、依赖更新、环检测——看着像玩具题，实际是\"依赖图 + 求值策略 + 边界处理\"的综合考察。\n我翻了 31 篇面经（17 篇 Harvey 2026 实战 + 14 篇其他公司 2019–2026），把这道题的出题规律、五阶段变体、两种标准解法一次性讲透。\n## 一、先看数据：这题有多火\n| 公司 | 篇数 | 年份 | 轮次 |\n|---|---|---|---|\n| OpenAI | 5 | 2023–2025 | 店面/电面为主 |\n| Harvey | 17 | 2026 | 电面+Onsite |\n| Sigma Computing | 2 | 2025 | 技术电面 |\n| Ramp | 1 | 2026 | Onsite |\n| Google | 1 | 2022 | 电面+Onsite |\n|"}],"posts":[{"tid":1190142,"title":"[面试经验] AI公司高频题：Spreadsheet设计题全解析（10家公司·31篇面经）|openai面经","chars":2600,"floors":1,"roles":["mle"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1190142-1-1.html"}],"answer":[{"tid":1190142,"text":"如果你在准备 AI 公司（特别是 OpenAI、Harvey 这类）的面试，这道题你大概率会遇到：设计一个支持公式的电子表格。setCell/getCell、公式求值、依赖更新、环检测——看着像玩具题，实际是\"依赖图 + 求值策略 + 边界处理\"的综合考察。\n我翻了 31 篇面经（17 篇 Harvey 2026 实战 + 14 篇其他公司 2019–2026），把这道题的出题规律、五阶段变体、两种标准解法一次性讲透。\n## 一、先看数据：这题有多火\n| 公司 | 篇数 | 年份 | 轮次 |\n|---|---|---|---|\n| OpenAI | 5 | 2023–2025 | 店面/电面为主 |\n| Harvey | 17 | 2026 | 电面+Onsite |\n| Sigma Computing | 2 | 2025 | 技术电面 |\n| Ramp | 1 | 2026 | Onsite |\n| Google | 1 | 2022 | 电面+Onsite |\n| Pika | 1 | 2026 | OA/电面 |\n| Rippling | 1 | 2025 | L7 virtual onsite |\n| Pinterest | 1 | 2021 | MLE 电面 |\n| Houzz | 1 | 2019 | OA |\n| January | 1 | 2024 | VO |\n1. OpenAI 是这道题的最大用户（5 篇独立面经，横跨 2023–2025，题型高度稳定：getCell/setCell + 环检测 + 写测试）。\n2. Harvey 的 get_cell/set_cell + 依赖/环检测格式，基本就是 OpenAI 那套的翻版。\n3. 电面/OA 是重灾区，但 Ramp（2026 onsite）、Rippling（L7 onsite）证明 onsite 也会考，而且 onsite 版本更偏 OOD/API 设计。\n## 二、五阶段：这道题的完整变体图谱\nStage 1 — 基础 get/set\n纯表格存取。Ramp：26列×100行，setCell/getCell；Sigma 基础版：任意字符串列名 + printTopN(n)；Houzz：CSV 变体，702 列的 A1 命名换算（n=27→AA）。考察：API 设计、索引换算。\nStage 2 — 公式\n单元格可以存 \"=A1+B2-5\"。Sigma、Pika、Pinterest 都是这个阶段。follow-up 常加：SUM(A1:A10) 区间、MAX/MIN、括号。Google"}]},{"id":"rate-limiter","name":"Rate Limiter 限流器","name_en":"Rate Limiter","category":"coding","roles":["infra"],"stages":["Behavioral","Onsite"],"heat":1,"runnable":true,"frequency":null,"snippets":[{"tid":1185620,"text":"one Screen）\n形式：共享在线编辑器（类似 CoderPad），可以跑代码\n有，但重心放在\"实际工程题 + 快速搭原型\"上。找几个小需求，练习 30–60 分钟内从零搭出一个前后端能跑的小应用。练 streaming / 实时交互。SSE、WebSocket、前端如何处理流式响应，这些在和 LLM 相关的岗位里几乎必考。准备一套和 LLM 打交道的经验（哪怕是 side project）。rate limiting、成本、prompt/响应处理、错误重试这些点很加分。想清楚\"为什么是 OpenAI\"，并且能和你自己做过的事挂上钩。练习边写边讲。沟通在每一轮都占权重。面试大方地查文档、承认不确定，这不扣分，反而显得真实、工程化。\n六、一些个人感受\n整体体验比传统大厂舒服，题目更贴近真实工作，不太有\"为了考而考\"的感觉。节奏很快，recruiter 沟通高效。他们真的在找\"能自己把一个东西从想法做到上线\"的人，而不是只会解题的人。如果你平时就喜欢动手做产品、ship 东西，会比较对味。强度不低，Full-Stack 实战那轮尤其耗精力，注意时间管理。\n祝面试顺利。愿你拿到心仪的 offer\n收藏28\njoymon\ntomzhang\n浪漫歪歪\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦"}],"posts":[{"tid":1185620,"title":"OpenAI 全栈工程师（Full-Stack Engineer）面试经验分享|openai面经","chars":1848,"floors":9,"roles":["infra"],"stages":["Behavioral","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1185620-1-1.html"}],"answer":[{"tid":1185620,"text":"多传统大厂快不少\n二、整体流程 & 时间线\nRecruiter Screen（HR 电话，约 30 min）技术电话面 / Phone Screen（约 60 min，coding）Virtual Onsite Loop（一般 4–5 轮，可能拆成一到两天）Coding（practical，非纯算法）Full-Stack 实战 / Take-home-style live buildSystem DesignBehavioral / Mission & ValuesTeam Match + Offer下面逐轮展开。\n三、逐轮详情\nRound 0：Recruiter Screen\n标准的开场，recruiter 人挺 nice。聊的内容：\n简单过一遍简历和最近的项目为什么想来 OpenAI（这个真的会问，而且后面几乎每一轮都可能再问一次，一定要想清楚）期望的方向（product-facing 还是更偏 infra）薪资预期、时间线、有没有在面别的家Tip：这一轮不是走过场。你对 mission 的表达、对方向的清晰度会写进反馈里。别只说\"我觉得 AI 很酷\"，最好能结合自己做过的东西讲。\nRound 1：技术电话面（Phone Screen）\n形式：共享在线编辑器（类似 CoderPad），可以跑代码\n有，但重心放在\"实际工程题 + 快速搭原型\"上。找几个小需求，练习 30–60 分钟内从零搭出一个前后端能跑的小应用。练 streaming / 实时交互。SSE、WebSocket、前端如何处理流式响应，这些在和 LLM 相关的岗位里几乎必考。准备一套和 LLM 打交道的经验（哪怕是 side project）。rate limiting、成本、prompt/响应处理、错误重试这些点很加分。想清楚\"为什么是 OpenAI\"，并且能和你自己做过的事挂上钩。练习边写边讲。沟通在每一轮都占权重。面试大方地查文档、承认不确定，这不扣分，反而显得真实、工程化。\n六、一些个人感受\n整体体验比传统大厂舒服，题目更贴近真实工作，不太有\"为了考而考\"的感觉。节奏很快，recruiter 沟通高效。他们真的在找\"能自己把一个东西从想法做到上线\"的人，而不是只会解题的人。如果你平时就喜欢动手做产品、ship 东西，会比较对味。强度不低，Full-Stack 实战那轮尤其耗精力，注意时间管理。\n祝面试顺利。愿你拿到心仪的 offer\njoymon\ntomzhang\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n"}]},{"id":"webhook-delivery-system","name":"Webhook 投递系统","name_en":"Webhook Delivery System","category":"system-design","roles":["swe"],"stages":["Behavioral","Deep Dive"],"heat":1,"runnable":false,"frequency":"low","snippets":[{"tid":1195024,"text":"么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补充和纠错，我会持续更新。也祝大家都拿到心仪的 offer！\n收藏32\njesse1204\nitisreal\ngo2022\n美丽人生\n楼主/层主请继续！\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I"}],"posts":[{"tid":1195024,"title":"【整理，非个人面经】OpenAI 面经高频题汇总 + 我的备考笔记|openai面经","chars":1556,"floors":7,"roles":["swe"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1195024-1-1.html"}],"answer":[{"tid":1195024,"text":"先说明一下：我本人还没有面过 OpenAI，这篇不是个人面经。 最近在准备 OpenAI 的面试，把地里公开可见的帖子标题/摘要、以及其他公开面经资料里反复出现的题目做了一个整理，方便自己系统地准备，也分享给同样在备考的同学。如果有面过的大佬发现哪里整理得不准确，欢迎指正和补充，我会更新到主楼。\n一、流程大概是什么样\n公开资料里比较一致的说法：\nRecruiter / HR 初筛：聊背景、做过的项目、为什么想来 OpenAI技术电面：通常是 Coding，有的岗位还会加一轮 System Design；也有的岗位是先做 take-home 再深挖Onsite / VO：一般 4-6 轮，包含更难的 Coding、System Design、Project Deep Dive（深挖过去做过的项目）、Behavioral / Hiring Manager，以及跨团队协作类的问题最后还有 Team Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补充和纠错，我会持续更新。也祝大家都拿到心"}]},{"id":"light-source-sampling-mle","name":"光源采样","name_en":"Light Source Sampling","category":"coding","roles":["research"],"stages":["Team Match"],"heat":1,"runnable":true,"frequency":"low","snippets":[{"tid":1196512,"text":"岗，literally 刚面完第二轮的 ML coding + general coding。\nML 考了点光源射向一个平面（一维）的题，应该是老题了（）。很奇怪的是，HR 跟我说是 ML coding，但面试官跟我说是ML coding with math reasoning ，我就有点懵。 enai面经","chars":2194,"floors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"}],"answer":[{"tid":1190155,"text":"如果需要具体题目的原文或解题思路，欢迎私聊我；也欢迎直接在评论区交流，看到会回。\n整理了 18 篇 2026 年的 OpenAI 实战面经（SWE / MLE / Research Engineer），外加地里 Q2 2026 趋势分析和 Hot Questions 榜单（213 题，带频率和最近出题日期）。题库比 Harvey 大得多，但高频题依然集中。\n一、流程概览\n- Recruiter/HR call：聊背景和期望，注意——这一轮会问你对 AGI/AI safety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up：生产级优化（避免每次从 t=0 重算）。\n3. Social Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择、复活、胜率最大化。\n5. Toy Language / 类型推断——toString、泛型推断、函数签名。\n6. Text Editor——4 部分：buffer 增删\nding 汇总：prefix-product autog"}]},{"id":"elevator-scheduling-simulation","name":"电梯调度模拟","name_en":"Elevator Scheduling Simulation","category":"coding","roles":["swe"],"stages":["Deep Dive","Phone Screen"],"heat":1,"runnable":true,"frequency":"low","snippets":[{"tid":1195205,"text":"k of the system as a combination of:\nAn e-commerce store for browsing and purchasing games.A digital entitlement system that tracks which games each\nign和high level design全部cover，再开始deep dive。\nCoding:\nElevator scheduling\nPart 1.\nPart 2.\n还有Part 3，但我在Part 2就没debug完，就没看到part 3了。有代码模板：\nmodels.py:\nfrom dataclasses import dataclass, field# NB: A floor/level is 0-indexed for coding simplicity ev <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const D = JSON.parse(document.getElementById('DATA').textContent);
const QS = D.questions;
const byId = {}; QS.forEach((q,i)=>{q._n=i+1; byId[q.id]=q;});

/* ---------------- i18n ---------------- */
const T={
 zh:{bTitle:'题库',search:'搜索题目…',all:'全部',
    coding:'Coding',sd:'系统设计',bq:'行为面',other:'其他',
    stmt:'题目描述',runtime:'写代码',answer:'查看答案',noAns:'该题原帖未给出完整解法',
    run:'▶ 运行',reset:'重置',copy:'复制',full:'全屏',exit:'退出',
    output:'输出',err:'报错',running:'运行中',done:'运行完成，没有输出',
    loadHint:'首次运行需下载 Python 运行时（约 10MB）',
    back:'返回列表',mentions:n=>`${n} 篇帖子提到`,src:'来自原帖',
    empty:'没有匹配的题目',foot:'数据来自公开社区论坛的 OpenAI 面经帖 · Python 在浏览器本地运行',
    noStmt:'原帖未提供可摘录的描述'},
 en:{bTitle:'Questions',search:'Search questions…',all:'All',
    coding:'Coding',sd:'System Design',bq:'Behavioral',other:'Other',
    stmt:'Description',runtime:'Code',answer:'Show answer',noAns:'No full solution in the original posts',
    run:'▶ Run',reset:'Reset',copy:'Copy',full:'Fullscreen',exit:'Exit',
    output:'Output',err:'Error',running:'Running',done:'Finished with no output',
    loadHint:'First run downloads the Python runtime (~10MB)',
    back:'Back to list',mentions:n=>`in ${n} posts`,src:'from post',
    empty:'No matching questions',foot:'Data from public community forum OpenAI interview posts · Python runs locally in your browser',
    noStmt:'No description captured from the original posts'}
};
let LANG = localStorage.getItem('lang') || ((navigator.language||'en').toLowerCase().startsWith('zh')?'zh':'en');
const t=k=>T[LANG][k];
const qName=q=>LANG==='en'?(q.name_en||q.name):q.name;
const catLabel=c=>({coding:t('coding'),'system-design':t('sd'),behavioral:t('bq'),other:t('other')})[c]||c;

/* ---------------- 状态 ---------------- */
const st={cat:'all', q:'', done:new Set(JSON.parse(localStorage.getItem('done')||'[]'))};

/* ---------------- 视图切换 ---------------- */
function route(){
  const h=location.hash||'#/';
  const m=h.match(/^#\/q\/(.+)$/);
  if(m && byId[m[1]]){ showDetail(byId[m[1]]); }
  else { showList(); }
}
window.addEventListener('hashchange',route);

function showList(){
  document.getElementById('listView').classList.remove('hide');
  document.getElementById('detailView').classList.add('hide');
  document.getElementById('foot').classList.remove('hide');
  renderList();
  window.scrollTo(0,0);
}

function showDetail(q){
  document.getElementById('listView').classList.add('hide');
  document.getElementById('foot').classList.add('hide');
  const v=document.getElementById('detailView');
  v.classList.remove('hide');
  v.innerHTML = detailHTML(q);
  window.scrollTo(0,0);
  attachDetail(q);
}

/* ---------------- 列表渲染 ---------------- */
function renderList(){
  document.getElementById('brand').innerHTML='<span class="g">OpenAI</span> <span id="bTitle">'+t('bTitle')+'</span>';
  document.getElementById('qInput').placeholder=t('search');
  document.getElementById('listEmpty').textContent=t('empty');
  document.getElementById('foot').textContent=t('foot');

  const cats=[['all',t('all')],['coding',t('coding')],['system-design',t('sd')],['behavioral',t('bq')],['other',t('other')]];
  document.getElementById('tabs').innerHTML=cats.map(([k,label])=>{
    const n=k==='all'?QS.length:QS.filter(q=>q.category===k).length;
    return `<div class="tab ${st.cat===k?'on':''}" data-c="${k}">${label} <span style="opacity:.6">${n}</span></div>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{st.cat=el.dataset.c;renderList();});

  let list=QS.filter(q=>{
    if(st.cat!=='all'&&q.category!==st.cat) return false;
    if(st.q){
      const hay=(q.name+' '+(q.name_en||'')+' '+q.category+' '+(q.roles||[]).join(' ')).toLowerCase();
      if(!hay.includes(st.q)) return false;
    }
    return true;
  });

  document.getElementById('listEmpty').classList.toggle('hide',list.length>0);
  document.getElementById('qlist').innerHTML=list.map(q=>`
    <div class="qrow ${st.done.has(q.id)?'done':''}" data-id="${q.id}">
      <div class="qnum">${q._n}.</div>
      <div class="qname">${esc(qName(q))}</div>
      <div class="qmeta">
        <span class="dot ${q.category}"></span>
        <span class="qheat">${q.heat||0}</span>
      </div>
      <div class="chev">›</div>
    </div>`).join('');
  document.querySelectorAll('.qrow').forEach(el=>{
    el.onclick=()=>{location.hash='#/q/'+el.dataset.id;};
  });
}

/* ---------------- 详情渲染 ---------------- */
function detailHTML(q){
  const tags = `<span class="tag ${q.category}">${catLabel(q.category)}</span>`
    + (q.heat?`<span class="tag hot">${t('mentions')(q.heat)}</span>`:'')
    + (q.roles||[]).map(r=>`<span class="tag">${(r||'').toUpperCase()}</span>`).join('');

  const stmt = (q.snippets&&q.snippets.length)
    ? q.snippets.slice(0,3).map(s=>
        `<div class="stmt">${esc(s.text)}<span class="from">${t('src')} #${s.tid}</span></div>`
      ).join('<div style="height:10px"></div>')
    : `<div class="stmt" style="color:var(--dim2)">${t('noStmt')}</div>`;

  const editor = q.runnable ? `
    <div class="block">
      <h2>${t('runtime')}</h2>
      <div class="ed" id="ed-${q.id}">
        <div class="edbar"><span><span class="dot2"></span>main.py</span><span>Pyodide</span></div>
        <textarea class="code" spellcheck="false" id="code-${q.id}">${esc(tpl(q))}</textarea>
        <div class="edact">
          <button class="primary" data-act="run">${t('run')}</button>
          <button class="ghost" data-act="reset">${t('reset')}</button>
          <button class="ghost" data-act="copy">${t('copy')}</button>
          <button class="ghost" data-act="fs">${t('full')}</button>
        </div>
        <div class="out" id="out-${q.id}"></div>
      </div>
    </div>` : '';

  const ans = (q.answer&&q.answer.length) ? `
    <div class="block">
      <details class="ans">
        <summary>${t('answer')}<span class="cnt">${q.answer.length}</span></summary>
        <div class="ansbody">
          ${q.answer.map(a=>`<div class="piece">${esc(a.text)}<span class="src">${t('src')} #${a.tid}</span></div>`).join('')}
        </div>
      </details>
    </div>`
    : `<div class="block"><details class="ans"><summary>${t('answer')}<span class="cnt">0</span></summary>
        <div class="ansbody"><div class="empty" style="padding:14px 0">${t('noAns')}</div></div></details></div>`;

  return `
    <div class="back" id="backBtn">‹ ${t('back')}</div>
    <h1 class="dtitle">${q._n}. ${esc(qName(q))}</h1>
    <div class="tags">${tags}</div>
    <div class="block"><h2>${t('stmt')}</h2>${stmt}</div>
    ${editor}
    ${ans}`;
}

function attachDetail(q){
  document.getElementById('backBtn').onclick=()=>{location.hash='#/';};
  if(!q.runnable) return;
  const ed=document.getElementById('ed-'+q.id);
  const ta=document.getElementById('code-'+q.id);
  const out=document.getElementById('out-'+q.id);
  ed.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.act;
      if(a==='run') runPy(q,ta,out,b);
      else if(a==='reset'){ ta.value=tpl(q); }
      else if(a==='copy'){ navigator.clipboard.writeText(ta.value).then(()=>{const o=b.textContent;b.textContent='✓';setTimeout(()=>b.textContent=o,1100);}); }
      else if(a==='fs'){
        ed.classList.toggle('fs');
        b.textContent = ed.classList.contains('fs')?t('exit'):t('full');
        document.body.style.overflow = ed.classList.contains('fs')?'hidden':'';
      }
    };
  });
}

/* ---------------- Python ---------------- */
let pyodide=null, loading=null;
function ensurePy(){
  if(pyodide) return Promise.resolve(pyodide);
  if(loading) return loading;
  loading = loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"}).then(p=>{pyodide=p;return p;});
  return loading;
}
function tpl(q){
  const nm=qName(q);
  return `# ${nm}
# 先写思路，再动手；用 assert 验证边界

def solve(*args, **kwargs):
    # TODO
    pass

if __name__ == "__main__":
    print("${nm.replace(/"/g,'')}")
    # assert solve(...) == ...
`;
}
async function runPy(q,ta,out,btn){
  out.className='out show';
  out.innerHTML=`<span class="lbl">${t('running')}</span>${t('loadHint')}`;
  btn.disabled=true; const old=btn.textContent; btn.textContent=t('running')+'…';
  try{
    const py=await ensurePy();
    const buf=[];
    py.setStdout({batched:s=>buf.push(s)});
    py.setStderr({batched:s=>buf.push(s)});
    let err=null;
    try{ await py.runPythonAsync(ta.value); }catch(e){ err=e.message||String(e); }
    const txt=buf.join('');
    out.innerHTML = (txt?`<span class="lbl">${t('output')}</span>${esc(txt)}`:'')
      + (err?`<span class="lbl">${t('err')}</span><span class="err">${esc(err)}</span>`
           :(txt?'':`<span class="ok">${t('done')}</span>`));
  }catch(e){
    out.innerHTML=`<span class="lbl">${t('err')}</span><span class="err">${esc(e.message||e)}</span>`;
  }finally{ btn.disabled=false; btn.textContent=old; }
}

/* ---------------- 语言 ---------------- */
function applyLang(){
  document.documentElement.lang = LANG==='zh'?'zh-CN':'en';
  document.querySelectorAll('#lang span').forEach(el=>el.classList.toggle('on',el.dataset.l===LANG));
  localStorage.setItem('lang',LANG);
  route();
}
document.querySelectorAll('#lang span').forEach(el=>{
  el.onclick=()=>{LANG=el.dataset.l;applyLang();};
});
document.getElementById('qInput').oninput=e=>{st.q=e.target.value.trim().toLowerCase();renderList();};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------------- 启动 ---------------- */
applyLang();
</script>
</body>
</html>
