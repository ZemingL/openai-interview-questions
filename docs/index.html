<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenAI Interview Questions</title>
<style>
:root{
  --bg:#0b0e14;--bg2:#11151f;--card:#151a24;--card2:#1b212d;
  --line:#232a38;--txt:#e8ebf1;--dim:#8b95a8;--dim2:#5b6577;
  --ac:#10a37f;--ac2:#1ed7a4;--code:#0c1017;
  --coding:#10a37f;--sd:#5b8cff;--bq:#c084fc;--other:#f59e0b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--ac2);text-decoration:none}
.hide{display:none!important}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(11,14,20,.96);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)}
.topin{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.3px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .g{background:linear-gradient(90deg,var(--ac),var(--ac2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px;flex:0 0 auto}
.lang span{padding:4px 10px;font-size:12.5px;color:var(--dim);cursor:pointer;border-radius:6px;user-select:none}
.lang span.on{background:var(--ac);color:#04120e;font-weight:600}

.wrap{max-width:900px;margin:0 auto;padding:0 16px 70px}

/* ---------- 列表页 ---------- */
.searchrow{padding:14px 0 8px;display:flex;gap:8px}
input[type=search]{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:10px 14px;font-size:14.5px;outline:none;font-family:inherit}
input[type=search]:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:6px 14px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);color:var(--dim);font-size:13px;cursor:pointer;white-space:nowrap;user-select:none}
.tab.on{background:var(--ac);border-color:var(--ac);color:#04120e;font-weight:600}

.qlist{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:4px}
.qrow{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--card);
  border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:var(--card2)}
.qrow.done{opacity:.65}
.qnum{flex:0 0 34px;color:var(--dim2);font-size:13px;font-variant-numeric:tabular-nums}
.qname{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.coding{background:var(--coding)}.dot.system-design{background:var(--sd)}
.dot.behavioral{background:var(--bq)}.dot.other{background:var(--other)}
.qheat{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.chev{color:var(--dim2);font-size:16px;flex:0 0 auto}

/* ---------- 详情页 ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:14px;
  padding:14px 0 10px;cursor:pointer}
.back:hover{color:var(--txt)}
.dtitle{font-size:21px;font-weight:700;line-height:1.4;margin:0 0 10px;letter-spacing:-.3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:6px;background:var(--card2);
  color:var(--dim);border:1px solid var(--line)}
.tag.coding{background:rgba(16,163,127,.14);color:var(--ac2);border-color:rgba(16,163,127,.28)}
.tag.system-design{background:rgba(91,140,255,.14);color:#8aa9ff;border-color:rgba(91,140,255,.28)}
.tag.behavioral{background:rgba(192,132,252,.14);color:#d8b4fe;border-color:rgba(192,132,252,.28)}
.tag.other{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.28)}
.tag.hot{background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.26)}

.block{margin-bottom:22px}
.block h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim2);
  margin:0 0 10px;font-weight:600}
.stmt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;
  font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:#cdd4e0}
.stmt .from{display:block;font-size:11.5px;color:var(--dim2);margin-top:10px}

/* 编辑器 */
.ed{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code)}
.edbar{display:flex;justify-content:space-between;align-items:center;padding:8px 13px;
  background:var(--card2);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.edbar .dot2{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-right:6px}
textarea.code{width:100%;min-height:230px;background:var(--code);color:#cdd9e5;border:0;
  padding:14px;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;
  line-height:1.65;resize:vertical;outline:none;tab-size:4}
.edact{display:flex;gap:8px;padding:9px 13px;background:var(--card2);border-top:1px solid var(--line);flex-wrap:wrap}
button{font-family:inherit;font-size:13.5px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);padding:7px 16px;cursor:pointer;transition:.14s}
button:hover{border-color:var(--dim2)}
button.primary{background:var(--ac);border-color:var(--ac);color:#04120e;font-weight:600}
button.primary:disabled{opacity:.5}
button.ghost{font-size:12.5px;padding:6px 12px}
.out{display:none;padding:12px 14px;background:#05070a;border-top:1px solid var(--line);
  font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;color:#cdd9e5}
.out.show{display:block}
.out .lbl{display:block;font-size:10.5px;letter-spacing:.8px;color:var(--dim2);
  text-transform:uppercase;margin-bottom:6px}
.out .err{color:#f87171}.out .ok{color:var(--ac2)}

/* 答案折叠 */
details.ans{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.ans summary{padding:14px 16px;cursor:pointer;font-size:14.5px;font-weight:600;
  color:var(--txt);list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
details.ans summary::-webkit-details-marker{display:none}
details.ans summary::before{content:"▸";color:var(--ac);transition:.2s;display:inline-block}
details.ans[open] summary::before{transform:rotate(90deg)}
details.ans summary .cnt{font-size:12px;color:var(--dim2);font-weight:400;margin-left:auto}
.ansbody{padding:0 16px 16px;border-top:1px solid var(--line)}
.ansbody .piece{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--ac);
  border-radius:9px;padding:13px;margin-top:13px;font-size:14px;line-height:1.8;
  white-space:pre-wrap;word-break:break-word;color:#cdd4e0;max-height:420px;overflow:auto}
.ansbody .src{display:block;font-size:11.5px;color:var(--dim2);margin-top:9px}
.ansbody .empty{color:var(--dim2);font-size:13.5px;padding:14px 0}

.empty{text-align:center;padding:56px 20px;color:var(--dim2);font-size:14px}
footer{text-align:center;padding:34px 16px;color:var(--dim2);font-size:12px;line-height:1.9}

@media(max-width:640px){
  .topin{padding:10px 12px}
  .brand{font-size:16px}
  .wrap{padding:0 12px 60px}
  .qrow{padding:12px 13px;gap:9px}
  .qnum{flex-basis:28px;font-size:12px}
  .qname{font-size:14.5px}
  .qheat{display:none}
  .dtitle{font-size:18.5px}
  .stmt{padding:13px;font-size:14px}
  textarea.code{min-height:210px;font-size:13px;padding:12px}
  button{padding:8px 15px;font-size:13.5px}
  .ansbody .piece{font-size:13.5px;max-height:340px}
  details.ans summary{padding:12px 13px;font-size:14px}
  .ansbody{padding:0 13px 14px}
  /* 全屏编辑 */
  .ed.fs{position:fixed;inset:0;z-index:200;border-radius:0;display:flex;flex-direction:column;background:var(--bg)}
  .ed.fs textarea.code{flex:1;min-height:0;resize:none;font-size:15px}
  .ed.fs .out{max-height:38vh}
}
</style>
</head>

<script id="DATA" type="application/json">{"meta":{"source":"public community forum OpenAI interview posts","generated":"2026-11-19 00:22","posts":305,"questions":74,"total_chars":308221,"chars":308221},"roles":[{"id":"swe","count":57},{"id":"mle","count":17},{"id":"research","count":10},{"id":"infra","count":10},{"id":"ds","count":5},{"id":"em","count":1}],"categories":[{"id":"coding","name":"Coding","count":46},{"id":"system-design","name":"System Design","count":21},{"id":"behavioral","name":"Behavioral","count":5},{"id":"other","name":"Other","count":2}],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"questions":[{"id":"recruiter-hr-screen-bq","name":"Recruiter / HR 行为面","name_en":"Recruiter / HR Screen","category":"behavioral","roles":["swe"],"stages":["Phone Screen","Onsite"],"heat":33,"runnable":false,"frequency":"high","snippets":[{"tid":1195024,"text":"先说明一下：我本人还没有面过 OpenAI，这篇不是个人面经。 最近在准备 OpenAI 的面试，把地里公开可见的帖子标题/摘要、以及其他公开面经资料里反复出现的题目做了一个整理，方便自己系统地准备，也分享给同样在备考的同学。如果有面过的大佬发现哪里整理得不准确，欢迎指正和补充，我会更新到主楼。\n一、流程大概是什么样\n公开资料里比较一致的说法：\nRecruiter / HR 初筛：聊背景、做过的项目、为什么想来 OpenAI技术电面：通常是 Coding，有的岗位还会加一轮 System Design；也有的岗位是先做 take-home 再深挖Onsite / VO：一般 4-6 轮，包含更难的 Coding、System Design、Project Deep Dive（深挖过去做过的项目）、Behavioral / Hiring Manager，以及跨团队协作类的问题最后还有 Team Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码"},{"tid":1194603,"text":"LI recruiter reach out\nrecruiter call就不到十分钟，大致聊了聊就找到一个组面full sta\n没有进入on-site还是觉得很遗憾\nballissad\nGREkiller1234\nsotonzepler\n祝楼主一切顺利!\n418Teapot\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩三分地\n关于我们\n加入团队\n解锁VIP\nVIP通行证\n购买蓝莓\n商务合作\n企业招聘\n地里专栏\n服务条款\n社区守则\n隐私政策\n1Point3Acres.com do"},{"tid":1194068,"text":"ecruiter给schedule了2轮，面过后，又schedule了两轮。在准备和面试前两轮时，感觉recruiter效率奇高，邮件从来都是当天回复，甚至有两次是发出去10分钟内就回了。但面完后两轮之后，recruiter就似乎消失了一样，即不给我发邮件，也不回复我的邮件了。目前两周左右过去，没有任何更新。\n想问问地里有类似经历的朋友，四轮结束后，大概需要多久才能知道是否能进入下一轮？\n另外，据recruiter说，4轮面完之后，如果被move forward就要进入onsite/panel round了。根据之前我在地里看到的帖子，比如这个https://www.1point3acres.com/interview/thread/1173645， 似乎四轮面试有明确的pass/fail的标准：“额外要说的是，面试题目每道总分是4分，一般要全部做出来了才有4分。然后bar应该是至少4433这样。4443就比较稳。所以如果你不能overfit，这个题目还是很有难度的。”\n如果有知情的朋友，请问说一下这个标准是适用于所有RE/RS职位，还是取决于组和hiring manager呢？（个人感觉按照这个标准，我应该已经被拒了，因为我第四轮答得格外的差）\nGoogle L3 Team Match 求捞\n请问AI coding到底是想考什么？\n开放爱店面\n27ng 找工求助\nUp"},{"tid":1193097,"text":"感谢地里信息！通过了电面，拿到了VO\n我的岗位应该是个SF based的infra组 直接组招 SWE\nrecruiter提到了VO轮会有一个45分钟的Infra或者security相关的Interview\n有没有大佬了解这轮面试是面啥啊？翻遍了地里地外都没有发现有很详细的信息分享\n求分享 会加米！！\n收藏20\nleros1\nHarvey L6\ntiktok\nGoogle L3 Team Match 求捞\nNuro NG包\nNorth San Jose｜River View II 豪华公寓次卧招租\n请问AI coding到底是想考什么？\n现在到底怎么样才能过面试\n十进制 offer\n来自APP\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP"},{"tid":1192061,"text":"企业招聘\n地里专栏\n服务条款\n社区守则\n隐私政策\n1Point3Acres.com does not represent or guarantee the truthfulness, accuracy, or reliability of any of communications posted by users.\n华人生活公众号\n大米已加，求问楼主vo为什么有两道coding？\n因为有ddl，recruiter是店面vo合一起了，两轮店面，一轮design，一轮project presentation，一轮hm\n支持 1\n反对 0\n来自APP\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩三分地\n关于我们\n加入团队\n解锁VIP\nVIP通行证\n购买蓝莓\n商务合作\n企业招聘\n地里专栏\n服务条款\n社区守则\n隐私政策\n1Point3Acres.com does not represent or guarantee the tru"},{"tid":1191468,"text":"感觉挺意外的，没想到挂在这一轮。\n朋友内推，非ai 方向，跟现公司职位匹配度>80%。\n和recruiter约call的时候问有没有什么需要准备的，recruiter说不需要做任何准备，以为会是很casual的聊天\nrated。之前还挺期待面试，结果没想到还没开始就挂了。只能说提醒大家认真对待recruiter call吧。\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊 hars":965,"floors":1,"roles":["swe"],"stages":["Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1186686-1-1.html"},{"tid":1185620,"title":"OpenAI 全栈工程师（Full-Stack Engineer）面试经验分享|openai面经","chars":1848,"floors":9,"roles":["infra"],"stages":["Behavioral","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1185620-1-1.html"},{"tid":1185485,"title":"OAI recruiter 面挂经|openai面经","chars":698,"floors":1,"roles":["swe"],"stages":["OA"],"url":"https://www.1point3acres.com/bbs/thread-1185485-1-1.html"},{"tid":1183895,"title":"开放爱 电面 过经|openai面经","chars":1527,"floors":33,"roles":["swe"],"stages":["Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1183895-1-1.html"},{"tid":1183221,"title":"OpenAI recruiter call 面经，没啥技术|openai面经","chars":595,"floors":7,"roles":["swe"],"stages":["Onsite"],"url":"https://www.1point3acres.com/bbs/thread-1183221-1-1.html"},{"tid":1182440,"title":"OpenAI recruiter面挂有冷冻期吗？|openai求职讨论","chars":717,"floors":6,"roles":["ds"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1182440-1-1.html"},{"tid":1182294,"title":"求oai general coding 75min面经 可换题|openai面经","chars":486,"floors":2,"roles":["swe"],"stages":["OA"],"url":"https://www.1point3acres.com/bbs/thread-1182294-1-1.html"},{"tid":1181608,"title":"開放愛 碼農全套過經|openai面经","chars":1506,"floors":33,"roles":["swe"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1181608-1-1.html"},{"tid":1179566,"title":"请问OAI的recruiter放鸽子是什么情况？|openai求职讨论","chars":765,"floors":2,"roles":["ds"],"stages":["OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1179566-1-1.html"},{"tid":1173327,"title":"OpenAI纽约求捞|openai求职讨论","chars":890,"floors":2,"roles":["ds","infra"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1173327-1-1.html"},{"tid":1173155,"title":"OAI DS 面试Analytical Solving,有人有经验吗|openai求职讨论","chars":767,"floors":2,"roles":["ds"],"stages":["OA","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1173155-1-1.html"},{"tid":1169167,"title":"OpenAI recruiter 聊完被拒","chars":1835,"floors":26,"roles":["ds"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1169167-1-1.html"},{"tid":1168616,"title":"OpenAI DS 面经|openaiPM面经","chars":915,"floors":8,"roles":["ds","mle"],"stages":["OA","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1168616-1-1.html"},{"tid":1165464,"title":"OpenAI HM聊完挂了|openai求职讨论","chars":1735,"floors":21,"roles":["ds"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1165464-1-1.html"},{"tid":1147205,"title":"OpenAI Developer Productivity前端口头Offer，要不要撕Roblox offer？|openai求职讨论","chars":2421,"floors":31,"roles":["swe"],"stages":["Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1147205-1-1.html"}],"answer":[{"tid":1195024,"text":"先说明一下：我本人还没有面过 OpenAI，这篇不是个人面经。 最近在准备 OpenAI 的面试，把地里公开可见的帖子标题/摘要、以及其他公开面经资料里反复出现的题目做了一个整理，方便自己系统地准备，也分享给同样在备考的同学。如果有面过的大佬发现哪里整理得不准确，欢迎指正和补充，我会更新到主楼。\n一、流程大概是什么样\n公开资料里比较一致的说法：\nRecruiter / HR 初筛：聊背景、做过的项目、为什么想来 OpenAI技术电面：通常是 Coding，有的岗位还会加一轮 System Design；也有的岗位是先做 take-home 再深挖Onsite / VO：一般 4-6 轮，包含更难的 Coding、System Design、Project Deep Dive（深挖过去做过的项目）、Behavioral / Hiring Manager，以及跨团队协作类的问题最后还有 Team Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补充和纠错，我会持续更新。也祝大家都拿到心"}]},{"id":"ml-coding-numpy","name":"ML Coding（numpy / 数值稳定性）","name_en":"ML Coding (numpy / Numerical Stability)","category":"coding","roles":["swe"],"stages":["Phone Screen","Team Match"],"heat":28,"runnable":true,"frequency":null,"snippets":[{"tid":1196512,"text":"Research 岗，literally 刚面完第二轮的 ML coding + general coding。\nML 考了点光源射向一个平面（一维）的题，应该是老题了（）。很奇怪的是，HR 跟我说是 ML coding，但面试官跟我说是ML coding with math reasoning ，我就有点懵。不过 overall 不需要你有太多的 math/物理基础。\n第一问让写一个随机 sample 函数，给定光源位置，输出是若干个射到平面上的点的坐标；第二问给了这个理论上的 PDF 公式，让你对比你写的 sample 函数得到的曲线是不是和这个理论 pdf 公式相近；第三\n授求加米！新人还没到 200 米...\nUpdate 11/13: 收到拒信 昨天催了一下 hr，据说在 team match 了。听说挂了是因为组里 hc 比较有限，只能留给很 fit 的人。\n白菜3383\nDenise.L\n小亩_29c04ea\nlitJordan\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到1"},{"tid":1194529,"text":"RT，lz在寻找面经准备开放爱的昂赛，看到地里之前有RE的小伙伴面到这两道题：\n60 minute ML coding interview -We'll cover math and coding and have an open-ended discussion/brainstorm about research ideas. A basic understanding of NumPy is helpful but not required. You will need a Google account to access the interview notebook. Please let us know if you don't have one before the interview.\n75 minute coding interview -This is a coding question where you’ll write code to design data structures optimized for reads and writes in the language of your choice. It’ll have nothing to do with AI/ML or complex algorith"},{"tid":1193666,"text":"Got 2 rounds of phone screen, 1 coding, 2 ML coding, and 1 ML syst\niewer couldn't understand my solution lol.\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩三分地\n关于我们\n加入团队\n解锁VIP\nVIP通行证\n购买蓝莓\n商务合作\n企业招聘\n地里专栏\n服务条款\n社区守则\n隐私政策\n1Point3Acres.com does not represent or guarantee the truthfuln"},{"tid":1193368,"text":"刚面完两轮ml coding.\n第一轮 noisy data an\n同学， 欢迎交流分享！ 第一轮我有nb\n收藏14\nmhthlxx\n怡然的西红柿\nlalalala5134\n开心的猪\n上岸观察员\n禁止访问\n积分111\n头像被屏蔽\n上岸观察员\n提示: 作者被禁止或删除 内容自动屏蔽\n支持 3\n反对 0\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩三分地\n关于我们\n加入团队\n解锁VIP\nVIP通行证\n购买蓝莓\n商务合作\n企业招聘\n地里专栏"},{"tid":1191718,"text":"最近第一轮oai店面结束，ml coding面的是transformer debug这道题。一共四个bug，都是地里之前的帖子里有的：\ny（attention module的output）写成了v（kv cache的v）。attention mask没加-inf\npping Time的题： ，但这题似乎是60分钟，而不是75分钟的？请问面过这题的朋友可以确认下是否是60分钟吗？以及，正在准备面Math and Reasoning的朋友，可以交流一下吗？非常感谢！\n收藏21\nearthl1ng\nllyllylly\nZlwang.cs\n中级农民\n积分131\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26"},{"tid":1191430,"text":"筛选，4月到9月的帖子全扒了一遍，一共271篇，每篇的主楼和所有回复都看完了（有1篇被500积分锁了主楼看不到），花了好常时间整理。面过的欢迎在评论区补充纠错。\n先说流程，这半年基本固定了：HR call必问AGI和AI safety咋看，答不好直接挂；然后技术电面，两轮60-75分钟连着排，一轮coding一轮SD；过了是VO，4到5轮，coding、SD、BQ、deep dive，ML岗多一轮ML coding；最后HM chat再team match。电面出结果挺快的，1-3天。注意75分钟那轮如果是ML coding，重点押numpy和数值稳定性；60分钟那轮常考autograd那套。\ncoding高频题，植物感染最热，5个部分层层递进，能做到3-4个一般能过。但注意老题被针对性改了：Q3/Q4跟外面流传的H2H版本不一样，有人用H2H的做法去面大部分test case都没过，面试官知道题泄露了。GPU Credits第二热，grant/subtract/get balance那套，过期优先级加乱序操作，followup会问生产级优化咋避免从T0重算。Monster Battle是research岗高频。Poker/Card Game今年新变体特别多，三条>同花>对子>高牌再比踢脚，9月好几篇都是这个。还有KV Store、Machine Topolo"}],"posts":[{"tid":1196512,"title":"开放爱刚出炉烫手面经|openai面经","chars":2027,"floors":23,"roles":["research"],"stages":["Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1196512-1-1.html"},{"tid":1194529,"title":"[求助]请问开放爱昂赛这个prompt可能是哪些题呢？|openai求职讨论","chars":1733,"floors":1,"roles":["swe"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1194529-1-1.html"},{"tid":1193666,"title":"OpenAI screening|openai面经","chars":510,"floors":3, e-Home Assignment 题目分享｜可以分享openai 全套面经|anthropic求职讨论","chars":1545,"floors":18,"roles":["swe"],"stages":["Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1177202-1-1.html"},{"tid":1176223,"title":"开放爱 ml coding新题求交流|openai求职讨论","chars":1031,"floors":1,"roles":["ds"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1176223-1-1.html"},{"tid":1172762,"title":"openai面试流程|openai求职讨论","chars":751,"floors":9,"roles":["ds","research"],"stages":["OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1172762-1-1.html"},{"tid":1167939,"title":"求openai/gdm RE 面经","chars":764,"floors":3,"roles":["ds","research"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1167939-1-1.html"},{"tid":1164743,"title":"【求教】目标 OpenAI / xAI / Anthropic，除了刷题还需要打通哪些技术栈？","chars":1358,"floors":6,"roles":["infra","research"],"stages":["Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1164743-1-1.html"},{"tid":1118607,"title":"开放爱昂塞面试加面","chars":773,"floors":3,"roles":["swe"],"stages":["Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1118607-1-1.html"}],"answer":[{"tid":1190155,"text":"如果需要具体题目的原文或解题思路，欢迎私聊我；也欢迎直接在评论区交流，看到会回。\n整理了 18 篇 2026 年的 OpenAI 实战面经（SWE / MLE / Research Engineer），外加地里 Q2 2026 趋势分析和 Hot Questions 榜单（213 题，带频率和最近出题日期）。题库比 Harvey 大得多，但高频题依然集中。\n一、流程概览\n- Recruiter/HR call：聊背景和期望，注意——这一轮会问你对 AGI/AI safety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考 ,"title":"开放爱店面|openai面经","chars":517,"floors":4,"roles":["swe"],"stages":["Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1192280-1-1.html"},{"tid":1191902,"title":"开放爱电面挂经|openai面经","chars":1436,"floors":22,"roles":["swe"],"stages":["Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1191902-1-1.html"},{"tid":1190155,"title":"[面试经验] OpenAI面经汇总：18篇2026实战帖+高频题|openai面经","chars":2194,"floors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"},{"tid":1186697,"title":"[面试经验] 开放爱 RE（安全方向）两轮店面 —— Infection Spread + 1-NN，挂经|OpenAI面经","chars":1055,"floors":6,"roles":["swe"],"stages":["Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1186697-1-1.html"},{"tid":1182818,"title":"OAI mle/re phone screen + partial 昂赛|openai面经","chars":1293,"floors":16,"roles":["mle"],"stages":["Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1182818-1-1.html"},{"tid":1177202,"title":"求 Anthropic 4hr Take-Home Assignment 题目分享｜可以分享openai 全套面经|anthropic求职讨论","chars":1545,"floors":18,"roles":["swe"],"stages":["Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1177202-1-1.html"},{"tid":1176223,"title":"开放爱 ml coding新题求交流|openai求职讨论","chars":1031,"floors":1,"roles":["ds"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1176223-1-1.html"},{"tid":1164743,"title":"【求教】目标 OpenAI / xAI / Anthropic，除了刷题还需要打通哪些技术栈？","chars":1358,"floors":6,"roles":["infra","research"],"stages":["Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1164743-1-1.html"}],"answer":[{"tid":1195024,"text":"先说明一下：我本人还没有面过 OpenAI，这篇不是个人面经。 最近在准备 OpenAI 的面试，把地里公开可见的帖子标题/摘要、以及其他公开面经资料里反复出现的题目做了一个整理，方便自己系统地准备，也分享给同样在备考的同学。如果有面过的大佬发现哪里整理得不准确，欢迎指正和补充，我会更新到主楼。\n一、流程大概是什么样\n公开资料里比较一致的说法：\nRecruiter / HR 初筛：聊背景、做过的项目、为什么想来 OpenAI技术电面：通常是 Coding，有的岗位还会加一轮 System Design；也有的岗位是先做 take-home 再深挖Onsite / VO：一般 4-6 轮，包含更难的 Coding、System Design、Project Deep Dive（深挖过去做过的项目）、Behavioral / Hiring Manager，以及跨团队协作类的问题最后还有 Team Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补充和纠错，我会持续更新。也祝大家都拿到心"}]},{"id":"technical-deep-dive","name":"技术深挖 (Technical Deep Dive)","name_en":"Technical Deep Dive","category":"other","roles":["swe"],"stages":["Deep Dive","Onsite"],"heat":11,"runnable":false,"frequency":"very-high","snippets":[{"tid":1195205,"text":"ncher.\nYou can think of the system as a combination of:\nAn e-commerce store for browsing and purchasing games.A digital entitlement system that tracks which games each\nign和high level design全部cover，再开始deep dive。\nCoding:\nElevator scheduling\nPart 1.\nPart 2.\n还有Part 3，但我在Part 2就没debug完，就没看到part 3了。有代码模板：\nmodels.py:\nfrom dataclasses import dataclass, field# NB: A floor/level is 0-indexed for coding simplicity even though IRL we usually# refer to the first floor as floor 1. Keep that in mind for debugging / printing.@dataclassclass Person: id: str \"\"\"Just an identifier of an individual per"},{"tid":1195024,"text":"欢迎指正和补充，我会更新到主楼。\n一、流程大概是什么样\n公开资料里比较一致的说法：\nRecruiter / HR 初筛：聊背景、做过的项目、为什么想来 OpenAI技术电面：通常是 Coding，有的岗位还会加一轮 System Design；也有的岗位是先做 take-home 再深挖Onsite / VO：一般 4-6 轮，包含更难的 Coding、System Design、Project Deep Dive（深挖过去做过的项目）、Behavioral / Hiring Manager，以及跨团队协作类的问题最后还有 Team Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动"},{"tid":1191430,"text":"的面经。地里面经版按OpenAI筛选，4月到9月的帖子全扒了一遍，一共271篇，每篇的主楼和所有回复都看完了（有1篇被500积分锁了主楼看不到），花了好常时间整理。面过的欢迎在评论区补充纠错。\n先说流程，这半年基本固定了：HR call必问AGI和AI safety咋看，答不好直接挂；然后技术电面，两轮60-75分钟连着排，一轮coding一轮SD；过了是VO，4到5轮，coding、SD、BQ、deep dive，ML岗多一轮ML coding；最后HM chat再team match。电面出结果挺快的，1-3天。注意75分钟那轮如果是ML coding，重点押numpy和数值稳定性；60分钟那轮常考autograd那套。\ncoding高频题，植物感染最热，5个部分层层递进，能做到3-4个一般能过。但注意老题被针对性改了：Q3/Q4跟外面流传的H2H版本不一样，有人用H2H的做法去面大部分test case都没过，面试官知道题泄露了。GPU Credits第二热，grant/subtract/get balance那套，过期优先级加乱序操作，followup会问生产级优化咋避免从T0重算。Monster Battle是research岗高频。Poker/Card Game今年新变体特别多，三条>同花>对子>高牌再比踢脚，9月好几篇都是这个。还有KV Stor"},{"tid":1190155,"text":"fety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n二、高频题\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Cred"},{"tid":1187432,"text":"楼主vo加电面三轮coding 还有2轮sd 2轮hm 1轮deep dive\n最后一轮coding两问 第一问写完没时间run test 大概率是算不过\n想看看openai 是不是每一轮都要pass才有机会？ 有小伙伴有先例吗\nGoogle L3 Team Match 求捞\n请问AI coding到底是想考什么？\n现在到底怎么样才能过面试\n开放爱店面\n27ng 找工求助\nUpcoming Google Product DS Onsite but not enough points\nBrex 2027 Summer SWE Intern Program application is open!\n黑金刚花生\n活跃农民\n积分743\n黑金刚花生\n来自APP\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原 lse return Truedef run_simulation( world: _World, do_tick_fn: Callable[[Building], None], deb"}]},{"id":"kv-store-time-based","name":"KV Store / 时间戳索引","name_en":"KV Store / Time-based Index","category":"coding","roles":["swe"],"stages":["Phone Screen","Onsite"],"heat":10,"runnable":true,"frequency":null,"snippets":[{"tid":1195024,"text":"OpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补充和纠错"},{"tid":1194460,"text":"[Blind上看到的，大家自行判断]\nResumable Versioned Key-Value Store\nYou're building an in-memory key-value store used by a distributed training job to checkpoint model metadata.\nPart 1. Implement set(key, value, timestamp) and get(key, timestamp). get returns the value that was set at the closest timestamp at or before the given timestamp. Timestamps are\nthe number of versions. Thread-safe, though you may assume single-threaded access. If a key doesn't exist, return None or raise,"},{"tid":1194125,"text":"coding: 老题 durable kv store. followup: split\n的惩罚时间\n面完觉得肯定挂了，感谢面试官放过\nimagination2016\n中级农民\n积分164\nimagination2016\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩三分地\n关于我们\n加入团队\n解锁VIP\nVIP通行证\n购买蓝莓\n商务合作\n企业招聘\n地里专栏\n服务条款\n社区守则\n隐私政策\n1Point3Acres.com does not represent o"},{"tid":1192976,"text":"经典kvstore题，一共三问\n第一问 k,v及其对应的length都变成by\n完了还剩点时间聊一聊，水一水）\n攒人品攒人品\n怡然 tps://www.1point3acres.com/bbs/thread-1194125-1-1.html"},{"tid":1192976,"title":"openai店面coding|openai面经","chars":919,"floors":12,"roles":["swe"],"stages":["Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1192976-1-1.html"},{"tid":1191430,"title":"2026年4-9月 OpenAI 面经整理：271篇扒完，Q3题库换血|openai面经","chars":1965,"floors":16,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1191430-1-1.html"},{"tid":1187733,"title":"OpenAI RS电面过经 另求math & reasoning|openai面经","chars":500,"floors":7,"roles":["swe"],"stages":["Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1187733-1-1.html"},{"tid":1186722,"title":"开放爱 新鲜电面|openai面经","chars":569,"floors":10,"roles":["swe"],"stages":["Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1186722-1-1.html"},{"tid":1184346,"title":"爱开放店面。。。。。|openai面经","chars":521,"floors":6,"roles":["swe"],"stages":["Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1184346-1-1.html"},{"tid":1184287,"title":"开放爱 店面 挂经|openai面经","chars":492,"floors":10,"roles":["swe"],"stages":["Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1184287-1-1.html"},{"tid":1182404,"title":"开放爱75min电面面经|openai面经","chars":720,"floors":9,"roles":["swe"],"stages":["Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1182404-1-1.html"}],"answer":[{"tid":1195024,"text":"先说明一下：我本人还没有面过 OpenAI，这篇不是个人面经。 最近在准备 OpenAI 的面试，把地里公开可见的帖子标题/摘要、以及其他公开面经资料里反复出现的题目做了一个整理，方便自己系统地准备，也分享给同样在备考的同学。如果有面过的大佬发现哪里整理得不准确，欢迎指正和补充，我会更新到主楼。\n一、流程大概是什么样\n公开资料里比较一致的说法：\nRecruiter / HR 初筛：聊背景、做过的项目、为什么想来 OpenAI技术电面：通常是 Coding，有的岗位还会加一轮 System Design；也有的岗位是先做 take-home 再深挖Onsite / VO：一般 4-6 轮，包含更难的 Coding、System Design、Project Deep Dive（深挖过去做过的项目）、Behavioral / Hiring Manager，以及跨团队协作类的问题最后还有 Team Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补充和纠错，我会持续更新。也祝大家都拿到心"}]},{"id":"numpy-1nn-wx-b","name":"NumPy 1-NN / Wx+B","name_en":"NumPy 1-NN / Wx+B","category":"coding","roles":["swe","mle","research"],"stages":["Phone Screen","Onsite"],"heat":10,"runnable":true,"frequency":"high","snippets":[{"tid":1194529,"text":"RT，lz在寻找面经准备开放爱的昂赛，看到地里之前有RE的小伙伴面到这两道题：\n60 minute ML coding interview -We'll cover math and coding and have an open-ended discussion/brainstorm about research ideas. A basic understanding of NumPy is helpful but not required. You will need a Google account to access the interview notebook. Please let us know if you don't have one before the interview.\n75 minute coding interview -This is a coding question where you’ll write code to design data structures optimized for reads and writes in the language of your choice. It’ll have nothing to do with AI/ML or complex algorith"},{"tid":1192807,"text":"第一轮1nn\nlalalala5134\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩三分地\n关于我们\n加入团队\n解锁VIP\nVIP通行证\n购买蓝莓\n商务合作\n企业招聘\n地里专栏\n服务条款\n社区守则\n隐私政策\n1Point3Acres.com does not represent or guarantee the truthfulness, accuracy, or reliability of any of commu"},{"tid":1191430,"text":"欢迎在评论区补充纠错。\n先说流程，这半年基本固定了：HR call必问AGI和AI safety咋看，答不好直接挂；然后技术电面，两轮60-75分钟连着排，一轮coding一轮SD；过了是VO，4到5轮，coding、SD、BQ、deep dive，ML岗多一轮ML coding；最后HM chat再tea /www.1point3acres.com/bbs/thread-1178657-1-1.html"},{"tid":1164743,"title":"【求教】目标 OpenAI / xAI / Anthropic，除了刷题还需要打通哪些技术栈？","chars":1358,"floors":6,"roles":["infra","research"],"stages":["Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1164743-1-1.html"}],"answer":[{"tid":1190155,"text":"如果需要具体题目的原文或解题思路，欢迎私聊我；也欢迎直接在评论区交流，看到会回。\n整理了 18 篇 2026 年的 OpenAI 实战面经（SWE / MLE / Research Engineer），外加地里 Q2 2026 趋势分析和 Hot Questions 榜单（213 题，带频率和最近出题日期）。题库比 Harvey 大得多，但高频题依然集中。\n一、流程概览\n- Recruiter/HR call：聊背景和期望，注意——这一轮会问你对 AGI/AI safety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up：生产级优化（避免每次从 t=0 重算）。\n3. Social Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择、复活、胜率最大化。\n5. Toy Language / 类型推断——toString、泛型推断、函数签名。\n6. Text Editor——4 部分：buffer 增删\nding 汇总：prefix-product autog"}]},{"id":"payment-coffee-shop","name":"支付系统 / 咖啡店","name_en":"Payment System / Coffee Shop","category":"system-design","roles":["swe"],"stages":["Onsite","Phone Screen"],"heat":10,"runnable":false,"frequency":"very-high","snippets":[{"tid":1191811,"text":"题目是设计一个 payment processor。\n基本流程是商户先发 hold 请求，我们转给上游 payment network，拿到批准或者拒绝的结果。Hold 成功后，后续还会有单独的 charge 请求，charge 再\n量准备数据。另外一个很实际的坑是画图。我对 Excalidraw 不够熟，画框和连线花掉了一些时间。建议提前练一下工具，面试时图能支持讨论就够了。\n收藏15\nwkwan\nf430sc\n开心的猪\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写 ue)\nfeedback: initially, I implemented\nequirements: the network is fragile, please design to handle the scenario where the network is down and coming backimplementation: see the excalidraw files in this folder\nExperience\n两位面试官都是中国人，非常友善且乐于助人。第一位面试官帮我复制粘贴了测试用例，并直接指出了我代码中的错误；第二位面试官则非常有耐心地向我解释题目，并在我完成high-level design后，又进一步提出了后续问题。\nimplementa"}]},{"id":"gpu-credits","name":"GPU Credits 额度系统","name_en":"GPU Credits","category":"coding","roles":["swe"],"stages":["Phone Screen","Onsite"],"heat":8,"runnable":true,"frequency":"very-high","snippets":[{"tid":1195024,"text":"am Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目"},{"tid":1194575,"text":"16YOE, Target Staff, 被recruiter联系的\nScreen\nCoding: GPU Credit\nSD: Powergrid monitoring and control\nCoding: Rectangle board (add rectangles + check how many rectangles on a po\n前也只是个Senior，看我说完，就不疼不痒的问了几个问题，在我看来问的都很肤浅，所以我实在也不知道他会咋写feedback\n面了两次OAI都挂了，以后估计也不想再面这家公司了，太累了，简直就跟皇上选妃一样，全是玄学。希望面镜对大家有帮助\nweibest\nlitJordan\n开心的猪\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年"},{"tid":1191430,"text":"g；最后HM chat再team match。电面出结果挺快的，1-3天。注意75分钟那轮如果是ML coding，重点押numpy和数值稳定性；60分钟那轮常考autograd那套。\ncoding高频题，植物感染最热，5个部分层层递进，能做到3-4个一般能过。但注意老题被针对性改了：Q3/Q4跟外面流传的H2H版本不一样，有人用H2H的做法去面大部分test case都没过，面试官知道题泄露了。GPU Credits第二热，grant/subtract/get balance那套，过期优先级加乱序操作，followup会问生产级优化咋避免从T0重算。Monster Battle是research岗高频。Poker/Card ch，recruiter 邮件：General Codin"}],"posts":[{"tid":1195024,"title":"【整理，非个人面经】OpenAI 面经高频题汇总 + 我的备考笔记|openai面经","chars":1556,"floors":7,"roles":["swe"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1195024-1-1.html"},{"tid":1194575,"title":"开放爱全套挂经|openai面经","chars":717,"floors":11,"roles":["swe"],"stages":["OA"],"url":"https://www.1point3acres.com/bbs/thread-1194575-1-1.html"},{"tid":1191430,"title":"2026年4-9月 OpenAI 面经整理：271篇扒完，Q3题库换血|openai面经","chars":1965,"floors":16,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1191430-1-1.html"},{"tid":1191284,"title":"开放爱全套|openai面经","chars":1452,"floors":33,"roles":["swe"],"stages":["Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1191284-1-1.html"},{"tid":1190264,"title":"OpenAI GPU Credit II 怎么优化避免每次从 T0 replay？|openai面经","chars":800,"floors":6,"roles":["swe"],"stages":["Onsite"],"url":"https://www.1point3acres.com/bbs/thread-1190264-1-1.html"},{"tid":1190155,"title":"[面试经验] OpenAI面经汇总：18篇2026实战帖+高频题|openai面经","chars":2194,"floors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"},{"tid":1187632,"title":"开放爱行为面挂|openai面经","chars":996,"floors":13,"roles":["swe"],"stages":["Behavioral","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1187632-1-1.html"},{"tid":1187090,"title":"open ai 电面 挂经|openai面经","chars":1307,"floors":19,"roles":["swe"],"stages":["Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1187090-1-1.html"}],"answer":[{"tid":1195024,"text":"先说明一下：我本人还没有面过 OpenAI，这篇不是个人面经。 最近在准备 OpenAI 的面试，把地里公开可见的帖子标题/摘要、以及其他公开面经资料里反复出现的题目做了一个整理，方便自己系统地准备，也分享给同样在备考的同学。如果有面过的大佬发现哪里整理得不准确，欢迎指正和补充，我会更新到主楼。\n一、流程大概是什么样\n公开资料里比较一致的说法：\nRecruiter / HR 初筛：聊背景、做过的项目、为什么想来 OpenAI技术电面：通常是 Coding，有的岗位还会加一轮 System Design；也有的岗位是先做 take-home 再深挖Onsite / VO：一般 4-6 轮，包含更难的 Coding、System Design、Project Deep Dive（深挖过去做过的项目）、Behavioral / Hiring Manager，以及跨团队协作类的问题最后还有 Team Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补充和纠错，我会持续更新。也祝大家都拿到心"}]},{"id":"hm-bq-why-openai","name":"HM 行为面：为什么选 OpenAI","name_en":"HM Behavioral: Why OpenAI","category":"behavioral","roles":["infra","ds"],"stages":["Onsite","Phone Screen"],"heat":8,"runnable":false,"frequency":"very-high","snippets":[{"tid":1195024,"text":"较一致的说法：\nRecruiter / HR 初筛：聊背景、做过的项目、为什么想来 OpenAI技术电面：通常是 Coding，有的岗位还会加一轮 System Design；也有的岗位是先做 take-home 再深挖Onsite / VO：一般 4-6 轮，包含更难的 Coding、System Design、Project Deep Dive（深挖过去做过的项目）、Behavioral / Hiring Manager，以及跨团队协作类的问题最后还有 Team Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其"},{"tid":1194068,"text":"//www.1point3acres.com/interview/thread/1173645， 似乎四轮面试有明确的pass/fail的标准：“额外要说的是，面试题目每道总分是4分，一般要全部做出来了才有4分。然后bar应该是至少4433这样。4443就比较稳。所以如果你不能overfit，这个题目还是很有难度的。”\n如果有知情的朋友，请问说一下这个标准是适用于所有RE/RS职位，还是取决于组和hiring manager呢？（个人感觉按照这个标准，我应该已经被拒了，因为我第四轮答得格外的差）\nGoogle L3 Team Match 求捞\n请问AI coding到底是想考什么？\n开放爱店面\n27ng 找工求助\nUpcoming Google Product DS Onsite but not enough points\nBrex 2027 Summer SWE Intern Program application is open!\n现在到底怎么样才能过面试\n中级农民\n积分215\n来自APP\n100%\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九"},{"tid":1190155,"text":"含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n二、高频题\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up：生产级优化（避免每次从 t=0 重算）。\n3. Social Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System"},{"tid":1188929,"text":"in上找我。很快安排面了第一轮的coding + sys design，过了\n然后，hiring manager说要跟我聊一下。聊过以后说不合适。\n现在recruiter说，要能match到一个组，才能继续后面的面试。这个状态已经2、3周了.google и\n我猜是因为我的linkedin page多年没更新了，recruiter以为我还在做data的东西。-baidu 1point3acres\nhiring manager看了我的简历发现我有好几年没做data了，就觉得不合适？也或许是那个组已经招到人了？\n这个recruiter是data platform大组的，看他这个意思整个data platform都没有合适的。我得去OpenAI的其他部门找match。因为不是他管的部门，我看recruiter也根本没兴趣帮我去找了。\n-baidu 1point3acres\n跪求大佬捞取，或者帮我介绍给有head count的manager. .и\n感激不尽！\n本主题由 匿名用户-YSJO5 于 2026-9-10 02:57 匿名\nGoogle L3 Team Match 求捞\n请问AI coding到底是想考什么？\n现在到底怎么样才能过面试\n开放爱店面\n27ng 找工求助\nUpcoming Google Product DS Onsite but not enough po"},{"tid":1185620,"text":"practical，非纯算法）Full-Stack 实战 / Take-home-style live buildSystem DesignBehavioral / Mission & ValuesTeam Match + Offer下面逐轮展开。\n三、逐轮详情\nRound 0：Recruiter Screen\n标准的开场，recruiter 人挺 nice。聊的内容：\n简单过一遍简历和最近的项目为什么想来 OpenAI（这个真的会问，而且后面几乎每一轮都可能再问一次，一定要想清楚）期望的方向（product-facing 还是更偏 infra）薪资预期、时间线、有没有在面别的家Tip：这一轮不是走过场。你对 mission 的表达、对方向的清晰度会写进反馈里。别只说\"我觉得 AI 很酷\"，最好能结合自己做过的东西讲。\nRound 1：技术电话面（Phone Screen）\n形式：共享在线编辑器（类似 CoderPad），可以跑代码\n有，但重心放在\"实际工程题 + 快速搭原型\"上。找几个小需求，练习 30–60 分钟内从零搭出一个前后端能跑的小应用。练 streaming / 实时交互。SSE、WebSocket、前端如何处理流式响应，这些在和 LLM 相关的岗位里几乎必考。准备一套和 LLM 打交道的经验（哪怕是 side project）。rate limiti"},{"tid":1185498,"text":"楼主被内推后被match到了一个不是很match的组。（普通swe，非常小众的方向，但是跟之前做的项目有联系。据说是内部的ai 系统推荐的）本来楼主不是很想面但是奈何recruiter非常的热情。于是就同意跟HM聊了聊。很经典的bq面。然后就挂了。。。-baidu 1point3acres\n. 1point 3 acres\nrecruiter说挂的原因是背景不match ， 又说没有冷冻期让我去投别的position\n发到地里看看有没有人遇到类似的情况，请问这种情况该咋办\n. 1point 3 acres\n提前祝大家找工顺利\nGoogle L3 Team Match 求捞\n请问AI coding到底是想考什么？\n现在到底怎么样才能过面试\n开放爱店面\n27ng 找工求助\nUpcoming Google Product DS Onsite but not enough points\nBrex 2027 Summer SWE Intern Program application is open!\nkaim8o\n积分508\nkaim8o\n100%\n浏览过的版块\n晒工资抖包袱\ngas f"}],"posts":[{"tid":1195024,"title":"【整理，非个人面经】OpenAI 面经高频题汇总 + 我的备考笔记|openai面经","chars":1556,"floors":7,"roles":["swe"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1195024-1-1.html"},{"tid":1194068,"title":"OpenAI面完四轮后被recruiter ghost|openai求职讨论","chars":2384,"floors":29,"roles":["swe"],"stages":["OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1194068-1-1.html"},{"tid":1190155,"title":"[面试经验] OpenAI面经汇总：18篇2026实战帖+高频题|openai面经","chars":2194,"floors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"},{"tid":1188929,"title":"OpenAI team match求捞|openai求职讨论","chars":1222,"floors":4,"roles":["infra"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1188929-1-1.html"},{"tid":1185620,"title":"OpenAI 全栈工程师（Full-Stack Engineer）面试经验分享|openai面经","chars":1848,"floors":9,"roles":["infra"],"stages":["Behavioral","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1185620-1-1.html"}, es.com/bbs/thread-1191082-1-1.html"},{"tid":1190155,"title":"[面试经验] OpenAI面经汇总：18篇2026实战帖+高频题|openai面经","chars":2194,"floors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"},{"tid":1189801,"title":"openai RE technical面|openai面经","chars":1782,"floors":23,"roles":["swe"],"stages":["Onsite"],"url":"https://www.1point3acres.com/bbs/thread-1189801-1-1.html"},{"tid":1188895,"title":"OAI Prompt求问|openai面经","chars":636,"floors":5,"roles":["swe"],"stages":["OA"],"url":"https://www.1point3acres.com/bbs/thread-1188895-1-1.html"},{"tid":1188350,"title":"开放爱ML coding题目总结 + 求noisy annotator的notebook|openai面经","chars":1593,"floors":25,"roles":["swe"],"stages":["OA"],"url":"https://www.1point3acres.com/bbs/thread-1188350-1-1.html"},{"tid":1183292,"title":"[面试经验] OpenAI RE technical，Infection Simulation + Data Annotation|openai面经","chars":1255,"floors":18,"roles":["swe"],"stages":["OA"],"url":"https://www.1point3acres.com/bbs/thread-1183292-1-1.html"}],"answer":[{"tid":1190155,"text":"如果需要具体题目的原文或解题思路，欢迎私聊我；也欢迎直接在评论区交流，看到会回。\n整理了 18 篇 2026 年的 OpenAI 实战面经（SWE / MLE / Research Engineer），外加地里 Q2 2026 趋势分析和 Hot Questions 榜单（213 题，带频率和最近出题日期）。题库比 Harvey 大得多，但高频题依然集中。\n一、流程概览\n- Recruiter/HR call：聊背景和期望，注意——这一轮会问你对 AGI/AI safety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up： 序）；cl\nself._last_close[key] = max(ts, self._last_close.get(key, float(\"-inf\")))\nself._chats_of[user].add(key)\ndef _prune(self, key) -> bool:\n\"\"\"Evict expired touches; drop the chat if nothing in-window remains.\"\"\"\nlst = self._touches.get(key)\nif lst:\ndel lst[:bisect_left(lst, self._start())]\nif not lst:\ndel self._touches[key]\nif key not in self._touches:\nself._last_close.pop(key, None)\nreturn False\nreturn True\ndef count_recent(self, user: str, chat: int) -> int:\nkey = (user, chat)\nif not self._prune(key):\nself._chats_of[user].discard(key)\nreturn 0\nreturn len(self._touches[key])\ndef count_live(self, user: str) -> int:\nfor ke"}]},{"id":"distributed-cluster-count-topology","name":"分布式集群 / Machine Topology","name_en":"Distributed Cluster / Machine Topology","category":"coding","roles":["swe","mle"],"stages":["Phone Screen","Onsite"],"heat":6,"runnable":true,"frequency":"high","snippets":[{"tid":1191430,"text":"2H的做法去面大部分test case都没过，面试官知道题泄露了。GPU Credits第二热，grant/subtract/get balance那套，过期优先级加乱序操作，followup会问生产级优化咋避免从T0重算。Monster Battle是research岗高频。Poker/Card Game今年新变体特别多，三条>同花>对子>高牌再比踢脚，9月好几篇都是这个。还有KV Store、Machine Topology、ModalLock多线程那套。infra组专属topology ma\n次。HR的说法是得有1到2个spike才送HC。\n3. onsite过了也不稳，好几起feedback positive但没headcount/approval被挂的，还有要了reference然后挂的，HC过了原组满了要重新team match的都有。有Sr Staff面完发现组里根本没staff的HC，headcount说没就没。\n4. 冷冻期说法不一，6个月/12个月/没冷冻期的都有，可能看组看时间，别信死一年。\n5. prompt基本可以忽略，好几个面过的人说\"和prompt一点关系都没有\"，只有60/75min的时长是有效信号，别花时间押prompt。\n有用的原帖放这儿：\n写了这么多求个米不过分吧，面过OpenAI的欢迎来评论区补充！\n收藏109\n好苗"},{"tid":1190142,"text":"OpenAI 的招牌变体。\n（lazy vs eager）。\n2. 主动问清的四个问题：空单元格算什么？环是抛错还是返回哨兵？公式支持哪些运算符？读多写多还是写多读少？（第 4 个直接引出 lazy/eager 选型，面试官最爱听。）\n3. LeetCode 631（Design Excel Sum Formula）是这道题的原型，值得刷一遍——评论区有人考据过，631 本身是递归 DFS 不是拓扑排序，别记混。\n4. OpenAI/Harvey 流程：留 10 分钟写测试，test case 里一定要含一个环。\n## 六、引用（14 篇非 Harvey 面经）\n- Ramp onsite 2026:\n- Sigma 电面 2025-07:\n- Sigma 电面 2025-04（环检测返回-1）:\n- Google 电面+Onsite 2022:\n- OpenAI OpenSheet 2025（lazy vs eager 官 cial Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择、复活、胜率最大化。\n5. Toy Language / 类型推断——toString、泛型推断、函数签名。\n6. Text Editor——4 部分：buffer 增删\nding 汇总：prefix-product autograd、Transformer debug、1NN、cross-entropy、noisy annotator\n16. 2026-9-01，Research，recruiter 邮件：General Coding 偏应用统计（准备帖）\n17. 2026-9-14，ML，ML System Design mock 求队友（准备帖）\n18. 2026-9-04，ML，追问 ML coding onsite 内容：math coding、numpy、手写 miniGPT（提问帖）\n五、备考建议\n1. Coding：Plant Infection 5 部分手写一遍（grid 模拟题，练到 30 分钟内写完）；GPU Credits 的过期优先级逻辑；Text Editor 的 undo/redo 双栈。\n2. ML track：Transformer 4 个经典"},{"tid":1188350,"text":"正在准备oai的ml coding的面试，总结一下目前在地里看到的OAI的面经，其中出现过的ML coding round的题有（以下不分顺序）：\nPrefix product autogradTransformer Debug + implementing KV cache1NNImplement cross ent\n自己顶一下，目前还是没找到noisy annotator的notebook。收到了一些跟帖的提醒，但是很多都被删掉了。如果想联系我的话，可以直接私信我？或者随便留个言，我来联系你。多谢！\n收藏35\n怡然的西红柿\nsrjalan\njetfish1900\nshmcudsp\nhao359510974\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项"},{"tid":1182818,"text":"分享个OAI面筋，顺便求大米\n除了店面都是原题，因为过度准备题库跟得失心太重，面的很糟。很懊悔\n店面考malloc，其他人分享过，细节差别不大。一共两问：先naive first-fit解，然后讨论并简易实现best-fit\nML Coding (Prompt 为matmul + backprop)\n题目大概为一个简化版GEMM，第一部分先与考官推导基本的sharded matmul\n第二部分為用numpy/pytorch推导matmul + backprop across device。之后有捉虫环节，\n会告知有一个固定\ntrong>\n竟然还有后续，感谢国人同学们给过。之后与head of codex (Andrey)做project deep dive。面试官无敌sharp，也问的非常细。答得不好，挂了。 。 。\n不过仔细比对后跟我投的职缺好像没有对到，不知道是怎么回事。Recruiter说没有冷冻期，所以是直接投其他岗位吗？有没有OAI同学可以解惑一下\n收藏26\nPestoMayo\npangkai\n滚动的西瓜\n微信用户_t2v65\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因"}],"posts":[{"tid":1194788,"title":"开放爱RE 75min Systems Coding|openai求职讨论","chars":915,"floors":1,"roles":["ds","infra"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1194788-1-1.html"},{"tid":1191430,"title":"2026年4-9月 OpenAI 面经整理：271篇扒完，Q3题库换血|openai面经","chars":1965,"floors":16,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1191430-1-1.html"},{"tid":1190155,"title":"[面试经验] OpenAI面经汇总：18篇2026实战帖+高频题|openai面经","chars":2194,"floors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"},{"tid":1188350,"title":"开放爱ML coding题目总结 + 求noisy annotator的notebook|openai面经","chars":1593,"floors":25,"roles":["swe"],"stages":["OA"],"url":"https://www.1point3acres.com/bbs/thread-1188350-1-1.html"},{"tid":1182818,"title":"OAI mle/re phone screen + partial 昂赛|openai面经","chars":1293,"floors":16,"roles":["mle"],"stages":["Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1182818-1-1.html"}],"answer":[{"tid":1190155,"text":"如果需要具体题目的原文或解题思路，欢迎私聊我；也欢迎直接在评论区交流，看到会回。\n整理了 18 篇 2026 年的 OpenAI 实战面经（SWE / MLE / Research Engineer），外加地里 Q2 2026 趋势分析和 Hot Questions 榜单（213 题，带频率和最近出题日期）。题库比 Harvey 大得多，但高频题依然集中。\n一、流程概览\n- Recruiter/HR call：聊背景和期望，注意——这一轮会问你对 AGI/AI safety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up：生产级优化（避免每次从 t=0 重算）。\n3. Social Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择、复活、胜率最大化。\n5. Toy Language / 类型推断——toString、泛型推断、函数签名。\n6. Text Editor——4 部分：buffer 增删\nding 汇总：prefix-product autog"}]},{"id":"refactoring","name":"Refactoring 重构","name_en":"Refactoring","category":"coding","roles":["swe"],"stages":["Phone Screen","Onsite"],"heat":5,"runnable":true,"frequency":null,"snippets":[{"tid":1195024,"text":"位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补充和纠错，我会持续更新。也祝大家都拿到心仪的 offer！\n收藏32\njesse1204\nitisreal\ngo2022\n美丽人生\n楼主/层主请继续！\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管"},{"tid":1192669,"text":"看到我的这个有类似 more about reading and improving existing code，但是面试又只是说是普通coding 面, 这是不是就说明是code refactor的，看地里好像没有面经啊\nGoogle L3 Team Match 求捞\n请问AI coding到底是想考什么？\n现在到底怎么样才能过面试\n开放爱店面\n27ng 找工求助\nUpcoming Google Product DS Onsite but not enough points\nBrex 2027 Summer SWE Intern Program application is open!\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛"},{"tid":1192280,"text":"Coding: 和面经里面一样chatbot 需要refactor, 唯一有点不同的是对于每个away的人，只要是有人a\nnt SHA256和已有的照片一样的话，只能保持一个copy\n隔天就收到模版拒信。\nweibest\n来自APP\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩三分地\n关于我们\n加入团队\n解锁VIP\nVIP通行证\n购买蓝莓\n商务合作\n企业招聘\n地里专栏\n服务条款\n社区守则\n隐私政策\n1Point3Acres.com does not represent o"},{"tid":1191902,"text":"P\nVIP通行证\n购买蓝莓\n商务合作\n企业招聘\n地里专栏\n服务条款\n社区守则\n隐私政策\n1Point3Acres.com does not represent or guarantee the truthfulness, accuracy, or reliabi loors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"}],"answer":[{"tid":1195024,"text":"先说明一下：我本人还没有面过 OpenAI，这篇不是个人面经。 最近在准备 OpenAI 的面试，把地里公开可见的帖子标题/摘要、以及其他公开面经资料里反复出现的题目做了一个整理，方便自己系统地准备，也分享给同样在备考的同学。如果有面过的大佬发现哪里整理得不准确，欢迎指正和补充，我会更新到主楼。\n一、流程大概是什么样\n公开资料里比较一致的说法：\nRecruiter / HR 初筛：聊背景、做过的项目、为什么想来 OpenAI技术电面：通常是 Coding，有的岗位还会加一轮 System Design；也有的岗位是先做 take-home 再深挖Onsite / VO：一般 4-6 轮，包含更难的 Coding、System Design、Project Deep Dive（深挖过去做过的项目）、Behavioral / Hiring Manager，以及跨团队协作类的问题最后还有 Team Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补充和纠错，我会持续更新。也祝大家都拿到心"}]},{"id":"design-sora-video-generation","name":"设计 Sora 视频生成","name_en":"Design Sora Video Generation","category":"system-design","roles":["swe"],"stages":["Onsite","Phone Screen"],"heat":5,"runnable":false,"frequency":"very-high","snippets":[{"tid":1190702,"text":"和代码轮一样 面试官拿出了电面的题目\n不过面试官很友好 还跟我说了个重要的信息\n就是现在公司让面试官首选面power grid那道题 所以大家可以多准备准备\n后来换了设计sora 然后比\n时起步 有点怀念大厂的日子 很少遇到这么实诚的面试官了 是个华人小哥 希望高抬贵手\n求米求米 祝大家都顺利\n收藏11\nweibest\n楼主/层主请继续！\n楼主好人一生平安!\nanna-1080\ntgrLy2\n开心的猪\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩三分地\n关于我们\n加入团队\n解锁VIP\nVIP通行证\n购买蓝莓\n商务合作\n企业招聘\n地里专栏\n服务条款\n社区守则\n隐私政策\n1Point3"},{"tid":1190155,"text":"部分手写一遍（grid 模拟题，练到 30 分钟内写完）；GPU Credits 的过期优先级逻辑；Text Editor 的 undo/redo 双栈。\n2. ML track：Transformer 4 个经典 bug 背下来，KV cache 手写一遍；numpy 向量化只许用向量操作。\n3. SD：Payment（幂等、对账）和 Chess.com（匹配、WebSocket）各准备一套；Sora 那套 GPU 调度能聊。\n4. ML SD：RAG 全链路 + embedding 训练细节（见本系列第 3 篇）。\n5. BQ：Why OpenAI / AGI safety 提前写好 2 分钟版本，recruiter 那轮就会问。\n6. 速度是硬指标：多位挂经都提到\"写太慢\"\"没做完 follow-up\"，限时练。\nJasmine999999\n白发蓬乱的番茄\n418Teapot\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\nThe PIP I am Going Through"},{"tid":1186582,"text":"NG 之后第一次准备面试，从来没有 面过system design，感觉自己准备面试题的时候总觉得 有一些自己challenge自己却答不上来的点，遂把自己准备的过程和困惑发出来，希望大家讨论抛砖引玉。 （只准备了 三道最常见的面试题目前）\n1. Design Sora\n首先看了 hello interview 的design job scheduler来learn some context\n然后看了 以及H2H的solution\n感觉主要的考点有：\npriority based handlingWorker pool management (How to handle worker failure, preemption)看到目前感觉自己主要的设计思路就是两张表 (Job 存video request 所有的metadata, jobAttempt 存 每个job的所有execution），新job request进来就直接写表+写Queue（Queue按priority分成多个），有一个scheduler 专门用于和 所有的worker 通信， worker pull job from scheduler， s"},{"tid":1184859,"text":"分享一下最近的面试经历，攒攒人品，也给后面面试的朋友避个雷。\nPhone：\nCoding：Social Media，Part 1、Part 2。最后没有完全做完，不过把剩下的思路讲了一遍。System Design：Sora。面试官追问了一些细节，包括为什么选择 AWS SQS，以及如何处理各种 failure case。VO：\nBQ + Tech Deep Dive：这一轮整体体验很好，和面试官聊得有说有笑，氛围比较轻松。Coding：\n试官也比较正常。可惜最后被加面的考官狠狠输出了一波，只能无奈跪了。\n希望这篇面经能帮到后面面试的朋友，新人第一次发面经 也祝大家都能避开雷面试官，顺利上岸！\n求加米！祝大家早日上岸！\n收藏19\nedenncnj\ndatapath2020\nweibest\nyangc22\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九"},{"tid":1184281,"text":"Prompt大致长这样\nArchitecture/System Design Intervie\non什么的，感觉不太像是Sora？这个Prompt总不能给我来个国际象棋吧\nqinzzz\n积分605\nqinzzz\n来自APP\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid lant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up：生产级优化（避免每次从 t=0 重算）。\n3. Social Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择、复活、胜率最大化。\n5. Toy Language / 类型推断——toString、泛型推断、函数签名。\n6. Text Editor——4 部分：buffer 增删\nding 汇总：prefix-product autog"}]},{"id":"modal-lock-fair-modal-lock","name":"ModalLock / FairModalLock","name_en":"ModalLock / FairModalLock","category":"coding","roles":["swe"],"stages":["Phone Screen","Onsite"],"heat":4,"runnable":true,"frequency":"low","snippets":[{"tid":1191902,"text":"oes not represent or guarantee the truthfulness, accuracy, or reliability of any of communications posted by users.\n华人生活公众号\n开放爱这个 chatbot refactor 题有意思，Away/Taco/Meet 三个 bot 摆明了考 OOD 扩展性。lz 复盘说在 multithreading 上烧了时间，确实这种题先把可扩展结构搭出来比炫技重要。想问 devbox 环境顺手吗，评论区看着大家对细节分歧挺大。\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩三分地\n关于我们\n加入团队\n解锁VIP\nVIP通行证\n购买蓝莓\n商务合作\n企业招聘\n地里专栏\n服务条款\n社区守则\n隐私政策\n1Point3Acres.com does not represent or guarantee the truthful"},{"tid":1191430,"text":"se都没过，面试官知道题泄露了。GPU Credits第二热，grant/subtract/get balance那套，过期优先级加乱序操作，followup会问生产级优化咋避免从T0重算。Monster Battle是research岗高频。Poker/Card Game今年新变体特别多，三条>同花>对子>高牌再比踢脚，9月好几篇都是这个。还有KV Store、Machine Topology、ModalLock多线程那套。infra组专属topology ma\n次。HR的说法是得有1到2个spike才送HC。\n3. onsite过了也不稳，好几起feedback positive但没headcount/approval被挂的，还有要了reference然后挂的，HC过了原组满了要重新team match的都有。有Sr Staff面完发现组里根本没staff的HC，headcount说没就没。\n4. 冷冻期说法不一，6个月/12个月/没冷冻期的都有，可能看组看时间，别信死一年。\n5. prompt基本可以忽略，好几个面过的人说\"和prompt一点关系都没有\"，只有60/75min的时长是有效信号，别花时间押prompt。\n有用的原帖放这儿：\n写了这么多求个米不过分吧，面过OpenAI的欢迎来评论区补充！\nYj9097"},{"tid":1187539,"text":"Prompt: 75 min - Familiarity with basic ,"chars":2194,"floors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"},{"tid":1182448,"title":"open ai dsa round 面经|openai面经","chars":1328,"floors":11,"roles":["swe"],"stages":["OA"],"url":"https://www.1point3acres.com/bbs/thread-1182448-1-1.html"}],"answer":[{"tid":1190155,"text":"如果需要具体题目的原文或解题思路，欢迎私聊我；也欢迎直接在评论区交流，看到会回。\n整理了 18 篇 2026 年的 OpenAI 实战面经（SWE / MLE / Research Engineer），外加地里 Q2 2026 趋势分析和 Hot Questions 榜单（213 题，带频率和最近出题日期）。题库比 Harvey 大得多，但高频题依然集中。\n一、流程概览\n- Recruiter/HR call：聊背景和期望，注意——这一轮会问你对 AGI/AI safety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up：生产级优化（避免每次从 t=0 重算）。\n3. Social Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择、复活、胜率最大化。\n5. Toy Language / 类型推断——toString、泛型推断、函数签名。\n6. Text Editor——4 部分：buffer 增删\nding 汇总：prefix-product autog"}]},{"id":"design-ai-chatbot-system","name":"设计 AI Chatbot 系统","name_en":"Design AI Chatbot System","category":"system-design","roles":["swe"],"stages":["Phone Screen"],"heat":4,"runnable":false,"frequency":"medium","snippets":[{"tid":1192280,"text":"Coding: 和面经里面一样chatbot 需要refactor, 唯一有点不同的是对于每个away的人，只要是有人a\nnt SHA256和已有的照片一样的话，只能保持一个copy\n隔天就收到模版拒信。\nweibest\n来自APP\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\ p dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up：生产级优化（避免每次从 t=0 重算）。\n3. Social Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择、复活、胜率最大化。\n5. Toy Language / 类型推断——toString、泛型推断、函数签名。\n6. Text Editor——4 部分：buffer 增删\nding 汇总：prefix-product autog"}]},{"id":"reservoir-sampling","name":"Reservoir / 采样类","name_en":"Reservoir Sampling","category":"coding","roles":["swe"],"stages":["OA"],"heat":2,"runnable":true,"frequency":null,"snippets":[{"tid":1192550,"text":"急需大米！\n小白转码Leetcode 错题本\nLeetcode 个人打卡 10日速通版\n【面经】Stripe Coding：自行车路线规划 —— K 条最便宜的简单路径（过滤+复合成本）\n今天复习了二维dp 72. Edit Distance\n【面经】Anthropic Coding：调试 LRU 缓存的 Bug，再让它崩溃后能恢复（WAL + 快照）\n[面经] Strava Coding：海拔采样中的第一段爬升（严格版 + 容忍小幅下降）\n分享自己写的刷题插件LoopCoach：对标目标公司追踪30+知识点\n[面经] NVIDIA Coding：LRU 磁盘空间管理器（按容量淘汰）\n[面经] Meta Coding：没有地图的迷宫找奶酪（DFS + 回溯）\n[面经] Meta Coding：32 位整数按字节翻转（热身题）\n《别再按题号刷 LeetCode 了：Google 高频题的正确打开方式》\n10-17-2026 继续刷题打卡\n冷目灼灼的扁豆\n中级农民\n积分255\n冷目灼灼的扁豆\n100%\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10"},{"tid":1192549,"text":"小白转码Leetcode 错题本\nLeetcode 个人打卡 10日速通版\n【面经】Stripe Coding：自行车路线规划 —— K 条最便宜的简单路径（过滤+复合成本）\n今天复习了二维dp 72. Edit Distance\n【面经】Anthropic Coding：调试 LRU 缓存的 Bug，再让它崩溃后能恢复（WAL + 快照）\n[面经] Strava Coding：海拔采样中的第一段爬升（严格版 + 容忍小幅下降）\n分享自己写的刷题插件LoopCoach：对标目标公司追踪30+知识点\n[面经] NVIDIA Coding：LRU 磁盘空间管理器（按容量淘汰）\n[面经] Meta Coding：没有地图的迷宫找奶酪（DFS + 回溯）\n[面经] Meta Coding：32 位整数按字节翻转（热身题）\n《别再按题号刷 LeetCode 了：Google 高频题的正确打开方式》\n10-17-2026 继续刷题打卡\nsbtn.style.background = '#C7C7C"}],"posts":[{"tid":1192550,"title":"[面经] OpenAI System Design：实时 trivia 大逃杀平台","chars":1481,"floors":5,"roles":["swe"],"stages":["OA"],"url":"https://www.1point3acres.com/bbs/thread-1192550-1-1.html"},{"tid":1192549,"title":"[面经] OpenAI Coding：内存滑动窗口会话分析（3 Parts）","chars":3768,"floors":1,"roles":["swe"],"stages":["OA"],"url":"https://www.1point3acres.com/bbs/thread-1192549-1-1.html"}],"answer":[{"tid":1192549,"text":"是严格大于）。\n- 活跃 = 最新 touch 落在 [T-14, T] 内且未被 close。\n过期用 lazy 方式处理：`count_live` 时 sweep 该用户的 chat，窗口内已无事件的直接删（内存保持有界），数活跃的个数。写路径不需要全局扫描。\n举例：t=2 touch → 1；t=8 close → 0。\n## Part 3：乱序到达\n第三个 part 放宽一个假设：事件现在可能乱序到达（ts 可能比已处理的更小）。查询看到的 T 依然单调不减，清理可以放到查询时做。\n### 思路\n核心洞察：T 永远不回退，所以查询时踢掉的东西以后永远进不了窗口——lazy cleanup 是安全的。\n- `ingest` 只记录：每个 key 一个有序的 touch 时间列表（bisect 插入），每个 key 一个最大 close 时间戳。到达时已经 `< T-14` 的直接丢弃（它永远进不了未来的窗口）。\n- 查询时：二分踢掉过期的 touch，删掉已死的 chat，然后计数。最新 touch 就是列表尾（保持有序）；cl\nself._last_close[key] = max(ts, self._last_close.get(key, float(\"-inf\")))\nself._chats_of[user].add(key)\ndef _prune(self, key) -> bool:\n\"\"\"Evict expired touches; drop the chat if nothing in-window remains.\"\"\"\nlst = self._touches.get(key)\nif lst:\ndel lst[:bisect_left(lst, self._start())]\nif not lst:\ndel self._touches[key]\nif key not in self._touches:\nself._last_close.pop(key, None)\nreturn False\nreturn True\ndef count_recent(self, user: str, chat: int) -> int:\nkey = (user, chat)\nif not self._prune(key):\nself._chats_of[user].discard(key)\nreturn 0\nreturn len(self._touches[key])\ndef count_live(self, user: str) -> int:\nfor ke"}]},{"id":"design-steam-game-store-launcher","name":"Steam 商店启动器","name_en":"Design Steam Game Store Launcher","category":"system-design","roles":["swe","infra"],"stages":["Phone Screen","Deep Dive"],"heat":2,"runnable":false,"frequency":"low","snippets":[{"tid":1195205,"text":"两轮，一轮design一轮coding\nDesign:\nPC Game Store and Launcher\nDesign the backend architecture for a Steam-like PC game store and desktop launcher.\nYou can think of the system as a combination of:\nAn e-commerce store for browsing and purchasing games.A digital entitlement system that tracks which games each\nign和high level design全部cover，再开始deep dive。\nCoding:\nElevator scheduling\nPart 1.\nPart 2.\n还有Part 3，但我在Part 2就没debug完，就没看到part 3了。有代码模板：\nmodels.py:\nfrom dataclasses import dataclass, field# NB: A floor/level is 0-indexed"},{"tid":1185620,"text":"reen（HR 电话，约 30 min）技术电话面 / Phone Screen（约 60 min，coding）Virtual Onsite Loop（一般 4–5 轮，可能拆成一到两天）Coding（practical，非纯算法）Full-Stack 实战 / Take-home-style live buildSystem DesignBehavioral / Mission & ValuesTeam Match + Offer下面逐轮展开。\n三、逐轮详情\nRound 0：Recruiter Screen\n标准的开场，recruiter 人挺 nice。聊的内容：\n简单过一遍简历和最近的项目为什么想来 OpenAI（这个真的会问，而且后面几乎每一轮都可能再问一次，一定要想清楚）期望的方向（product-facing 还是更偏 infra）薪资预期、时间线、有没有在面别的家Tip：这一轮不是走过场。你对 mission 的表达、对方向的清晰度会写进反馈里。别只说\"我觉得 AI 很酷\"，最好能结合自己做过的东西讲。\nRound 1：技术电话面（Phone Screen）\n形式：共享在线编辑器（类似 CoderPad），可以跑代码\n有，但重心放在\"实际工程题 + 快速搭原型\"上。找几个小需求，练习 30–60 分钟内从零搭出一个前后端能跑的小应用。练"}],"posts":[{"tid":1195205,"title":"开放爱电面|openai面经","chars":4175,"floors":21,"roles":["swe"],"stages":["Deep Dive","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1195205-1-1.html"},{"tid":1185620,"title":"OpenAI 全栈工程师（Full-Stack Engineer）面试经验分享|openai面经","chars":1848,"floors":9,"roles":["infra"],"stages":["Behavioral","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1185620-1-1.html"}],"answer":[{"tid":1195205,"text":"engers_str = \",\".join([str(person) for person in self.passengers]) match self.direction: case 0: dir_str = \"\" case 1: dir_str = \"↑\" case -1: dir_str = \"↓\" case _: raise Exception(f\"Unknown direction {self.direction}\") return f\"{dir_str}[{passengers_str}]\"@dataclassclass Building: elevators: list[Elevator] @property def elevator(self) -> Elevator: \"\"\" For parts 1-3, there is only 1 elevator, so use this accessor for convenience. \"\"\" return self.elevators[0] floors: list[Floor] @property def num_floors(self) -> int: return len(self.floors)@dataclassclass _World: building: Building tick_to_calls: dict[int, list[Person]] tick: int = 0\nloop.pyfrom typing import Callablefrom animation import animatefrom models import Building, _Worlddef _is_simulation_over(world: _World) -> bool: if world.tick <= max(world.tick_to_calls.keys()): return False for elevator in world.building.elevators: if len(elevator.passengers) > 0: return False for floor in world.building.floors: if len(floor.people) > 0: return False return Truedef run_simulation( world: _World, do_tick_fn: Callable[[Building], None], deb"}]},{"id":"job-scheduler-bug-fix","name":"任务调度器 Bug 修复","name_en":"Job Scheduler Bug Fix","category":"coding","roles":["swe"],"stages":["Onsite","Phone Screen"],"heat":2,"runnable":true,"frequency":"single","snippets":[{"tid":1192061,"text":"一个字符串，原来这个位置及之后的元素都往后移一位。get(index)\n复制代码\n：返回指定下标的值。一开始提出了简单方案，但面试官认为效率不够。普通单向链表按下标读取需要\n执行时间取任务，再开线程执行。\n问题是正常执行可以标记COMPLETED\n复制代码\n，但 function 抛异常时，后面的状态更新不会执行，job 一直停在PENDING\n复制代码\n。问题是没有异常处理\n第二问 async scheduler bug是说提交的 jobs 看起来没有实际运行\n过了两天收到据信，准备了全部开放爱的题目但遇到两道新题\n收藏15\n67victor\nyuxrose\n祝楼主一切顺利!\nweibest\nsotonzepler\n积分628\nsotonzepler\nqqzwzzhqq\nBridgeBaby\nAndyppp\n请叫我热情老八\n418Teapot\n请叫我热情老八\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩三分地\n关于我们\n加"},{"tid":1186582,"text":"NG 之后第一次准备面试，从来没有 面过system design，感觉自己准备面试题的时候总觉得 有一些自己challenge自己却答不上来的点，遂把自己准备的过程和困惑发出来，希望大家讨论抛砖引玉。 （只准备了 三道最常见的面试题目前）\n1. Design Sora\n首先看了 hello interview 的design job scheduler来learn some context\n然后看了 以及H2H的solution\n感觉主要的考点有：\npriority based handlingWorker pool management (How to handle worker failure, preemption)看到目前感觉自己主要的设计思路就是两张表 (Job 存video request 所有的metadata, jobAttempt 存 每个job的所有execution），新job request进来就直接写表+写Queue（Queue按priority分成多个），有一个scheduler 专门用于和 所有的worker 通信， worker pull job from scheduler， scheduler 去queue里按priority 拿下一个job. Worker"}],"posts":[{"tid":1192061,"title":"偶爱新鲜VO挂经|openai面经","chars":1888,"floors":28,"roles":["swe"],"stages":["Onsite","Phone Screen"],"url":"https://www.1p oding：自行车路线规划 —— K 条最便宜的简单路径（过滤+复合成本）\n今天复习了二维dp 72. Edit Distance\n【面经】Anthropic Coding：调试 LRU 缓存的 Bug，再让它崩溃后能恢复（WAL + 快照）\n[面经] Strava Coding：海拔采样中的第一段爬升（严格版 + 容忍小幅下降）\n分享自己写的刷题插件LoopCoach：对标目标公司追踪30+知识点\n[面经] NVIDIA Coding：LRU 磁盘空间管理器（按容量淘汰）\n[面经] Meta Coding：没有地图的迷宫找奶酪（DFS + 回溯）\n[面经] Meta Coding：32 位整数按字节翻转（热身题）\n《别再按题号刷 LeetCode 了：Google 高频题的正确打开方式》\n10-17-2026 继续刷题打卡\n冷目灼灼的扁豆\n冷目灼灼的扁豆\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国"}]},{"id":"resumable-iterator","name":"可恢复迭代器","name_en":"Resumable Iterator","category":"coding","roles":["swe"],"stages":["Onsite","Behavioral"],"heat":2,"runnable":true,"frequency":"low","snippets":[{"tid":1195024,"text":"仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公"},{"tid":1194460,"text":"[Blind上看到的，大家自行判断]\nResumable Versioned Key-Value Store\nYou're building an in-memory key-value store used by a distributed training job to checkpoint model metadata.\nPart 1. Implement set(key, value, timestamp) and get(key, timestamp). get returns the value that was set at the closest timestamp at or before the given timestamp. Timestamps are\nthe number of versions. Thread-safe, though you may assume singl"}],"posts":[{"tid":1195024,"title":"【整理，非个人面经】OpenAI 面经高频题汇总 + 我的备考笔记|openai面经","chars":1556,"floors":7,"roles":["swe"],"stages":["Behavioral","Deep Dive","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1195024-1-1.html"},{"tid":1194460,"title":"OpenAI疑似从没见过的新题","chars":1388,"floors":5,"roles":["swe"],"stages":["Onsite"],"url":"https://www.1point3acres.com/bbs/thread-1194460-1-1.html"}],"answer":[{"tid":1195024,"text":"先说明一下：我本人还没有面过 OpenAI，这篇不是个人面经。 最近在准备 OpenAI 的面试，把地里公开可见的帖子标题/摘要、以及其他公开面经资料里反复出现的题目做了一个整理，方便自己系统地准备，也分享给同样在备考的同学。如果有面过的大佬发现哪里整理得不准确，欢迎指正和补充，我会更新到主楼。\n一、流程大概是什么样\n公开资料里比较一致的说法：\nRecruiter / HR 初筛：聊背景、做过的项目、为什么想来 OpenAI技术电面：通常是 Coding，有的岗位还会加一轮 System Design；也有的岗位是先做 take-home 再深挖Onsite / VO：一般 4-6 轮，包含更难的 Coding、System Design、Project Deep Dive（深挖过去做过的项目）、Behavioral / Hiring Manager，以及跨团队协作类的问题最后还有 Team Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码结构要干净，不然自己会坑自己。\n整理到的高频题型：\nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补充和纠错，我会持续更新。也祝大家都拿到心"}]},{"id":"vector-linked-list-checkpoints","name":"向量化链表检查点","name_en":"Vectorized Linked List Checkpoints","category":"coding","roles":["swe"],"stages":["Phone Screen","OA"],"heat":2,"runnable":true,"frequency":"single","snippets":[{"tid":1192380,"text":"recruter reachout应该是背景比较fit，稍微screen了一下就约了电面\n问了一道malloc，给了一些test\n第一问 malloc/free，手写用list模拟了链表没能一遍过，调了一会面试\n了，结果正撞枪口上\n除此之外聊的还挺不错，本来以为同是买它妹能救我出苦海，结果还是我太菜了\n求大米看面经，我要刷爆\nweibest\nyuxiang1515\n黑金刚花生\nllyllylly\nfieeu312\n中级农民\n积分293\nfieeu312\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩三分地\n关于我们\ -1.html"},{"tid":1178657,"title":"oai ml coding求交流numpy puzzle|openai求职讨论","chars":895,"floors":1,"roles":["ds"],"stages":["OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1178657-1-1.html"}],"answer":[{"tid":1190155,"text":"如果需要具体题目的原文或解题思路，欢迎私聊我；也欢迎直接在评论区交流，看到会回。\n整理了 18 篇 2026 年的 OpenAI 实战面经（SWE / MLE / Research Engineer），外加地里 Q2 2026 趋势分析和 Hot Questions 榜单（213 题，带频率和最近出题日期）。题库比 Harvey 大得多，但高频题依然集中。\n一、流程概览\n- Recruiter/HR call：聊背景和期望，注意——这一轮会问你对 AGI/AI safety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up：生产级优化（避免每次从 t=0 重算）。\n3. Social Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择、复活、胜率最大化。\n5. Toy Language / 类型推断——toString、泛型推断、函数签名。\n6. Text Editor——4 部分：buffer 增删\nding 汇总：prefix-product autog"}]},{"id":"social-network-follow-graph","name":"社交网络关注图","name_en":"Social Network Follow Graph","category":"coding","roles":["swe","mle","research"],"stages":["Phone Screen","Behavioral"],"heat":2,"runnable":true,"frequency":"very-high","snippets":[{"tid":1193684,"text":"上周五刚面完 OpenAI 两轮电面，来地里分享一下面经。\nCoding 题是 Social Graph Snapshot\n久会收到 recruiter 的反馈？通常是几天还是一两周？\n求米，祝大家好运！\n418Teapot\nadwith\nchen-f\n浏览过的版块\n晒工资抖包袱\ngas furnace的修理方法\n德国官方/学术界总结出来的外国人润德国的原因\n发帖聊聊焦虑症\n从unpaid到欠薪，再到年薪不到10万还上六天班，我到底哪里走错了？\n写了本书\n详细讲解：在欧洲玩宫殿要懂的套路\n26年10月SDE找工存档\n九评领英\nThe PIP I am Going Through\n用项目管理的方式找承包商\n论坛导航\n新手指南\n常见Q&A\n一亩
