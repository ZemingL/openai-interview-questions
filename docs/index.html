<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenAI Interview Questions</title>
<style>
:root{
  --bg:#0b0e14; --bg2:#11151f; --card:#161b26; --card2:#1c2230;
  --line:#232a3a; --txt:#e6e9ef; --dim:#8b95a8; --dim2:#5e6878;
  --accent:#10a37f; --accent2:#1ed7a4; --code:#0d1117;
  --coding:#10a37f; --sd:#4f7cff; --bq:#c084fc; --other:#f59e0b;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px}

/* ---------- header ---------- */
header{padding:28px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
h1{margin:0 0 6px;font-size:24px;letter-spacing:-.4px;font-weight:700}
h1 .g{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin:0}
.hdrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:2px;flex:0 0 auto}
.lang span{padding:5px 11px;font-size:12.5px;color:var(--dim);cursor:pointer;
  border-radius:7px;user-select:none;transition:.15s;line-height:1.3}
.lang span.on{background:var(--accent);color:#04120e;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--dim);display:flex;align-items:baseline;gap:4px}
.stat b{color:var(--txt);font-size:15px;font-variant-numeric:tabular-nums;margin-right:4px}
.stat span{color:var(--dim);margin-left:3px}

/* ---------- filters ---------- */
.filters{position:sticky;top:0;z-index:30;background:rgba(11,14,20,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px}
.searchrow{display:flex;gap:8px;margin-bottom:10px}
input[type=search]{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit}
input[type=search]:focus{border-color:var(--accent)}
select{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;
  padding:10px 12px;font-size:13px;outline:none;font-family:inherit;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  transition:.15s;user-select:none}
.chip:hover{border-color:var(--dim2);color:var(--txt)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#04120e;font-weight:600}
.chip .n{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;transition:.18s}
.card:hover{border-color:#2c3548}
.head{padding:15px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.rank{flex:0 0 34px;height:34px;border-radius:9px;background:var(--card2);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--dim);
  font-variant-numeric:tabular-nums}
.rank.hot{background:linear-gradient(135deg,#7c2d12,#b45309);color:#fff}
.body{flex:1;min-width:0}
.title{font-weight:600;font-size:15.5px;margin-bottom:7px;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:2.5px 8px;border-radius:6px;background:var(--card2);
  color:var(--dim);border:1px solid var(--line)}
.tag.cat-coding{background:rgba(16,163,127,.14);color:var(--accent2);border-color:rgba(16,163,127,.28)}
.tag.cat-system-design{background:rgba(79,124,255,.14);color:#8aa9ff;border-color:rgba(79,124,255,.28)}
.tag.cat-behavioral{background:rgba(192,132,252,.14);color:#d8b4fe;border-color:rgba(192,132,252,.28)}
.tag.cat-other{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.28)}
.tag.heat{background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.25)}
.tag.run{background:rgba(16,163,127,.18);color:var(--accent2);border-color:rgba(16,163,127,.35)}
.metrics{display:flex;gap:14px;color:var(--dim2);font-size:12px;margin-top:8px;flex-wrap:wrap}
.metrics b{color:var(--dim);font-variant-numeric:tabular-nums}
.panel{display:none;border-top:1px solid var(--line);padding:16px;background:var(--bg2)}
.card.open .panel{display:block}
.sec{margin-bottom:18px}
.sec:last-child{margin-bottom:0}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim2);
  margin:0 0 9px;font-weight:600}

/* ---------- snippets ---------- */
.snip{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:8px;padding:11px 13px;margin-bottom:8px;font-size:13.5px;color:#c8cfdb;
  white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;line-height:1.65}
.snip .from{display:block;font-size:11px;color:var(--dim2);margin-bottom:6px}
.snip .from a{color:var(--dim)}

/* ---------- posts ---------- */
.posts{display:flex;flex-direction:column;gap:6px}
.post{display:flex;gap:10px;align-items:baseline;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;font-size:13px}
.post .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.post .m{color:var(--dim2);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- editor ---------- */
.editor-wrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code)}
.editor-bar{display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:var(--card2);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.editor-bar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px}
textarea.code{width:100%;min-height:180px;background:var(--code);color:#c9d1d9;border:0;
  padding:13px;font-family:"SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:13px;line-height:1.6;resize:vertical;outline:none;tab-size:4}
.runs{display:flex;gap:8px;padding:9px 12px;background:var(--card2);border-top:1px solid var(--line);flex-wrap:wrap}
button{font-family:inherit;font-size:13px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);padding:7px 15px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--dim2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#04120e;font-weight:600}
button.primary:disabled{opacity:.5;cursor:wait}
button.ghost{font-size:12px;padding:5px 11px}
.out{background:#05070a;border-top:1px solid var(--line);padding:12px 13px;font-family:"SF Mono",ui-monospace,Menlo,monospace;
  font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;display:none;color:#c9d1d9}
.out.show{display:block}
.out .err{color:#f87171}
.out .ok{color:var(--accent2)}
.out .label{color:var(--dim2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--dim2);margin-top:6px}
.empty{text-align:center;padding:60px 20px;color:var(--dim2)}
footer{text-align:center;padding:36px 16px;color:var(--dim2);font-size:12px;line-height:1.9}
.backtop{position:fixed;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);display:none;place-items:center;
  font-size:18px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:50;color:var(--dim)}
.backtop.show{display:grid}
/* ---- 移动端：折叠筛选 + 紧凑卡片 ---- */
.fbtn{display:none}
.fbody{}
@media(max-width:640px){
  body{font-size:15px}
  .wrap{padding:0 10px 70px}
  header{padding:18px 0 12px}
  h1{font-size:21px}
  .sub{font-size:12px;line-height:1.5}
  .stats{gap:6px;margin-top:10px}
  .stat{padding:6px 9px;font-size:11px;border-radius:8px}
  .stat b{font-size:13px}

  /* 筛选：默认折叠 */
  .filters{padding:9px 0}
  .searchrow{gap:6px;margin-bottom:0}
  input[type=search],select{padding:9px 12px;font-size:14px;border-radius:9px}
  select{max-width:96px}
  .fbtn{display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 12px;
    background:var(--card);border:1px solid var(--line);border-radius:9px;
    font-size:13px;color:var(--dim);cursor:pointer;user-select:none}
  .fbtn i{margin-left:auto;font-style:normal;transition:.2s;font-size:11px}
  .fbtn.open i{transform:rotate(180deg)}
  #fcount{color:var(--accent2);font-variant-numeric:tabular-nums}
  .fbody{display:none;padding-top:8px}
  .fbody.open{display:block}
  .chips{gap:5px;padding-bottom:5px;-webkit-overflow-scrolling:touch}
  .chip{padding:6px 11px;font-size:12px}

  /* 卡片 */
  .list{gap:9px}
  .card{border-radius:12px}
  .head{padding:12px 12px;gap:9px}
  .rank{flex-basis:28px;height:28px;font-size:10.5px;border-radius:8px}
  .title{font-size:15px;line-height:1.45;margin-bottom:6px}
  .tags{gap:4px}
  .tag{font-size:10.5px;padding:2px 7px}
  .metrics{gap:10px;font-size:11.5px;margin-top:6px}
  .panel{padding:12px}
  .sec{margin-bottom:15px}
  .sec h3{font-size:11px;margin-bottom:7px}
  .snip{font-size:14px;line-height:1.7;padding:10px 11px;max-height:280px}
  .post{padding:8px 10px;font-size:13px;gap:7px}
  .post .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
  .post .m{font-size:11px}

  /* 编辑器：手机上更宽松 */
  textarea.code{min-height:200px;font-size:13px;padding:11px;line-height:1.65}
  .editor-bar{font-size:11.5px;padding:7px 11px}
  .runs{padding:8px 10px;gap:6px}
  button{padding:8px 14px;font-size:13.5px}
  button.ghost{padding:6px 11px;font-size:12.5px}
  .out{font-size:12px;max-height:240px}
  .hint{font-size:11px}

  /* 全屏编辑 */
  .editor-wrap.fs{position:fixed;inset:0;z-index:200;border-radius:0;
    display:flex;flex-direction:column;background:var(--bg)}
  .editor-wrap.fs textarea.code{flex:1;min-height:0;font-size:15px;
    max-height:none;resize:none}
  .editor-wrap.fs .out{max-height:40vh}
  .backtop{bottom:14px;right:12px;width:40px;height:40px;font-size:16px}
}
</style>
</head>

<script id="DATA" type="application/json">{"meta":{"source":"public community forum OpenAI interview posts","generated":"2026-11-18 23:51","posts":305,"questions":74,"total_chars":1740477,"chars":1740477},"roles":[{"id":"swe","count":64},{"id":"mle","count":15},{"id":"infra","count":6},{"id":"research","count":5},{"id":"ds","count":2},{"id":"em","count":1}],"categories":[{"id":"coding","name":"Coding","count":46},{"id":"system-design","name":"System Design","count":21},{"id":"behavioral","name":"Behavioral","count":5},{"id":"other","name":"Other","count":2}],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen"],"questions":[{"id":"recruiter-hr-screen-bq","name":"Recruiter / HR 行为面","name_en":"Recruiter / HR Screen","category":"behavioral","roles":["swe"],"stages":["Phone Screen","Onsite"],"heat":50,"runnable":false,"frequency":"high","snippets":[{"tid":1195024,"text":"先说明一下：我本人还没有面过 OpenAI，这篇不是个人面经。 最近在准备 OpenAI 的面试，把地里公开可见的帖子标题/摘要、以及其他公开面经资料里反复出现的题目做了一个整理，方便自己系统地准备，也分享给同样在备考的同学。如果有面过的大佬发现哪里整理得不准确，欢迎指正和补充，我会更新到主楼。\n一、流程大概是什么样\n公开资料里比较一致的说法：\nRecruiter / HR 初筛：聊背景、做过的项目、为什么想来 OpenAI技术电面：通常是 Coding，有的岗位还会加一轮 System Design；也有的岗位是先做 take-home 再深挖Onsite / VO：一般 4-6 轮，包含更难的 Coding、System Design、Project Deep Dive（深挖过去做过的项目）、Behavioral / Hiring Manager，以及跨团队协作类的问题最后还有 Team Match，等级和组很多时候是到最后才定的不同组、不同岗位差别很大，上面的顺序仅供参考，具体以自己的 recruiter 通知为准。\n二、Coding 高频题型（重点：实用、多问递进）\nOpenAI 的 coding 明显不太像纯 LeetCode 刷题，更像实际工作里的小系统，而且常常一个题目分好几问，后一问建立在前一问的代码上。所以代码"},{"tid":1194603,"text":"LI recruiter reach out\nrecruiter call就不到十分钟，大致聊了聊就找到一个组面full sta您好！"},{"tid":1194068,"text":"ecruiter给schedule了2轮，面过后，又schedule了两轮。在准备和面试前两轮时，感觉recruiter效率奇高，邮件从来都是当天回复，甚至有两次是发出去10分钟内就回了。但面完后两轮之后，recruiter就似乎消失了一样，即不给我发邮件，也不回复我的邮件了。目前两周左右过去，没有任何更新。\n想问问地里有类似经历的朋友，四轮结束后，大概需要多久才能知道是否能进入下一轮？\n另外，据recruiter说，4轮面完之后，如果被move forward就要进入onsite/panel round了。根据之前我在地里看到的帖子，比如这个https://www.1point3acres.com/interview/thread/1173645， 似乎四轮面试有明确的pass/fail的标准：“额外要说的是，面试题目每道总分是4分，一般要全部做出来了才有4分。然后bar应该是至少4433这样。4443就比较稳。所以如果你不能overfit，这个题目还是很有难度的。”\n如果有知情的朋友，请问说一下这个标准是适用于所有RE/RS职位，还是取决于组和hiring manager呢？（个人感觉按照这个标准，我应该已经被拒了，因为我第四轮答得格外的差）\nGoogle L3 Team Match 求捞\n怎样快速拿到o和a家的面试？\n请问AI coding到底是想考什么？\n找工小"},{"tid":1193532,"text":"现在到底怎么样才能过面试\n找工小结 2026Q4\n【海投快淹死了, 来看看啊, 求内推】10 年后端 | Python/Go\nFortinet math and coding test\n十进制 offer\n砖场店面后10天无消息\nRippling的纸钱到底能不能变现\n亚麻能内推已申请过的岗位吗？\nSummer intern求建议\n地里匿名用户\n2026-10-19 08:45:44\n到底啥人能和recruiter都聊挂？\n使用独家折扣码 1p3acre 立享额外9折优惠！\n地里匿名用户\n2026-10-19 05:06:25\n不算，就是聊天，了解你的背景，还有你最近的跳槽打算，也许会问问为什么对openai有兴趣。\n职场新人升级通关攻略\n新人在组里如何站住脚，快速上手，迅速成长，获得认可\nintern如何拿到return offer\n地里匿名用户\n2026-10-19 05:15:31\n这种不算冷冻期。\n地里匿名用户\n2026-10-19 05:41:59\n会可能觉得不match不move forward 但不算冷冻期\n地里匿名用户\n2026-10-19 06:12:19\n这种跪了应该没有冷冻期，楼主背景太优秀了，被 reach out，恭喜\n地里匿名用户\n2026-10-19 06:56:15\n个人dp，聊完收到系统拒信。 我认为是有冷冻期的\n微信用户_0ko"},{"tid":1193097,"text":"我的岗位应该是个SF based的infra组 直接组招 SWE\nrecruiter提到了VO轮会有一个45分钟的Infra或者security相关的Interview\n有没有大佬了解这轮面试是面啥啊？翻遍了地里地外都没有发现有很详细的信息分享\n求分享 会加米！！\ninstant_dev"}],"posts":[{"tid":1195024,"title":"【整理，非个人面经】OpenAI 面经高频题汇总 + 我的备考笔记|openai面经","chars":5271,"floors":7,"roles":["swe"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1195024-1-1.html"},{"tid":1194603,"title":"OpenAI technical screening|openai面经","chars":3906,"floors":8,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1194603-1-1.html"},{"tid":1194068,"title":"OpenAI面完四轮后被recruiter ghost|openai求职讨论","chars":13749,"floors":29,"roles":["swe"],"stages":["OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1194068-1-1.html"},{"tid":1193684,"title":"OpenAI SWE 电面面经|openai面经","chars":4967,"floors":12,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1193684-1-1.html"},{"tid":1193677,"title":"OpenAI phone screen system design|openai面经","chars":2391,"floors":2,"r coding；最后HM chat再team match。电面出结果挺快的，1-3天。注意75分钟那轮如果是ML coding，重点押numpy和数值稳定性；60分钟那轮常考autograd那套。\ncoding高频题，植物感染最热，5个部分层层递进，能做到3-4个一般能过。但注意老题被针对性改了：Q3/Q4跟外面流传的H2H版本不一样，有人用H2H的做法去面大部分test case都没过，面试官知道题泄露了。GPU Credits第二热，grant/subtract/get balance那套，过期优先级加乱序操作，followup会问生产级优化咋避免从T0重算。Monster Ba"},{"tid":1190155,"text":"论区交流，看到会回。\n整理了 18 篇 2026 年的 OpenAI 实战面经（SWE / MLE / Research Engineer），外加地里 Q2 2026 趋势分析和 Hot Questions 榜单（213 题，带频率和最近出题日期）。题库比 Harvey 大得多，但高频题依然集中。\n一、流程概览\n- Recruiter/HR call：聊背景和期望，注意——这一轮会问你对 AGI/AI safety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical"}],"posts":[{"tid":1195820,"title":"开放爱 昂赛 BQ面经|openai面经","chars":3414,"floors":5,"roles":["swe"],"stages":["Behavioral","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1195820-1-1.html"},{"tid":1195478,"title":"开放爱 昂赛 SD|openai面经","chars":3988,"floors":8,"roles":["swe"],"stages":["Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1195478-1-1.html"},{"tid":1195205,"title":"开放爱电面|openai面经","chars":11879,"floors":21,"roles":["swe"],"stages":["Deep Dive","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1195205-1-1.html"},{"tid":1194603,"title":"OpenAI technical screening|openai面经","chars":3906,"floors":8,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1194603-1-1.html"},{"tid":1194249,"title":"开放爱店面体验很好|openai面经","chars":5624,"floors":11,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1194249-1-1.html"},{"tid":1194125,"title":"OAI 电面|openai面经","chars":4157,"floors":8,"roles":["swe"] 适用于所有RE/RS职位，还是取决于组和hiring manager呢？（个人感觉按照这个标准，我应该已经被拒了，因为我第四轮答得格外的差）\nGoogle L3 Team Match 求捞\n怎样快速拿到o和a家的面试？\n请问AI coding到底是想考什么？\n找工小结 2026Q4\n【海投快淹死了, 来看看啊, 求内推】10 年后端 | Python/Go\nFortinet math and coding test\n砖场店面后10天无消息\nRippling的纸钱到底能不能变现\n亚麻能内推已申请过的岗位吗？\nSummer intern求建议\nPinterest 27 phd mle ng\napple austin 的Enterprise Technology Services有人知道怎么样么？\nAnthropic 被拒后还有可能被捞吗\nStripe VO 和 Executive Chat 之后 被拒概率大吗\n27ng"},{"tid":1193532,"text":"offer\n砖场店面后10天无消息\nRippling的纸钱到底能不能变现\n亚麻能内推已申请过的岗位吗？\nSummer intern求建议\n地里匿名用户\n2026-10-19 08:45:44\n到底啥人能和recruiter都聊挂？\n使用独家折扣码 1p3acre 立享额外9折优惠！\n地里匿名用户\n2026-10-19 05:06:25\n不算，就是聊天，了解你的背景，还有你最近的跳槽打算，也许会问问为什么对openai有兴趣。\n职场新人升级通关攻略\n新人在组里如何站住脚，快速上手，迅速成长，获得认可\nintern如何拿到return offer\n地里匿名用户\n2026-10-19 05:15:31\n这种不算冷冻期。\n地里匿名用户\n2026-10-19 05:41:59\n会可能觉得不match不move forward 但不算冷冻期\n地里匿名用户\n2026-10-19 06:12:19\n这种跪了应该没有冷冻期，楼主背景太优秀了，被 reach out，恭喜\n地里匿名用户\n2026-10-19 06:56:15\n个人dp，聊完收到系统拒信。 我认为是有冷冻期的\n微信用户_0ko11\n地里新农-请到考试中心学习规则\n微信用户_0ko11\n2026-10-19 12:14:15\n地里匿名用户\n2026-10-20 15:13:37\n之前面过oai没过，后一年被一个tt来的"},{"tid":1190155,"text":"含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immunity countdown，电面 onsite 都出现。\n2. GPU Credits——create_grant / subtract / get_balance，带过期优先级、乱序操作；follow-up：生产级优化（避免每次从 t=0 重算）。\n3. Social Network / Follow Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择"},{"tid":1188929,"text":"in上找我。很快安排面了第一轮的coding + sys design，过了\n然后，hiring manager说要跟我聊一下。聊过以后说不合适。\n现在recruiter说，要能match到一个组，才能继续后面的面试。这个状态已经2、3周了.google и\n我猜是因为我的linkedin page多年没更新了，recruiter以为我还在做data的东西。-baidu 1point3acres\nhiring manager看了我的简历发现我有好几年没做data了，就觉得不合适？也或许是那个组已经招到人了？\n这个recruiter是data platform大组的，看他这个意思整个data platform都没有合适的。我得去OpenAI的其他部门找match。因为不是他管的部门，我看recruiter也根本没兴趣帮我去找了。\n-baidu 1point3acres\n跪求大佬捞取，或者帮我介绍给有head count的manager. .и\nGoogle L3 Team Match 求捞\n怎样快速拿到o和a家的面试？\n请问AI coding到底是想考什么？\n现在到底怎么样才能过面试\n找工小结 2026Q4\n【海投快淹死了, 来看看啊, 求内推】10 年后端 | Python/Go\nFortinet math and coding test\n砖场店面后10天无消息\nRip"},{"tid":1185620,"text":"practical，非纯算法）Full-Stack 实战 / Take-home-style live buildSystem DesignBehavioral / Mission & ValuesTeam Match + Offer下面逐轮展开。\n三、逐轮详情\nRound 0：Recruiter Screen\n标准的开场，recruiter 人挺 nice。聊的内容：\n简单过一遍简历和最近的项目为什么想来 OpenAI（这个真的会问，而且后面几乎每一轮都可能再问一次，一定要想清楚）期望的方向（product-facing 还是更偏 infra）薪资预期、时间线、有没有在面别的家Tip：这一轮不是走过场。你对 mission 的表达、对方向的清晰度会写进反馈里。别只说\"我觉得 AI 很酷\"，最好能结合自己做过的东西讲。\nRound 1：技术电话面（Phone Screen）\n形式：共享在线编辑器（类似 CoderPad），可以跑代码您好！\n有，但重心放在\"实际工程题 + 快速搭原型\"上。找几个小需求，练习 30–60 分钟内从零搭出一个前后端能跑的小应用。练 streaming / 实时交互。SSE、WebSocket、前端如何处理流式响应，这些在和 LLM 相关的岗位里几乎必考。准备一套和 LLM 打交道的经验（哪怕是 side project）。rate lim"}],"posts":[{"tid":1195024,"title":"【整理，非个人面经】OpenAI 面经高频题汇总 + 我的备考笔记|openai面经","chars":5271,"floors":7,"roles":["swe"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1195024-1-1.html"},{"tid":1194068,"title":"OpenAI面完四轮后被recruiter ghost|openai求职讨论","chars":13749,"floors":29,"roles":["swe"],"stages":["OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1194068-1-1.html"},{"tid":1193532,"title":"收到openai recruiter reach out约谈算面试吗|openai求职讨论","chars":3755,"floors":10,"roles":["swe"],"stages":["OA","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1193532-1-1.html"},{"tid":1190657,"title":"OpenAI Team Match求捞|openai求职讨论","chars":7084,"floors":13,"roles":["swe"],"stages":["Behavioral","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190657-1-1.html"},{"tid":1190155,"title":"[面试经验] OpenAI面经汇总：18篇2026实战帖+高频题|openai面经","chars":6243,"floors":9,"roles":["mle" tor的，看地里好像没有面经啊\nGoogle L3 Team Match 求捞\n怎样快速拿到o和a家的面试？\n请问AI coding到底是想考什么？\n现在到底怎么样才能过面试\n找工小结 2026Q4\n【海投快淹死了, 来看看啊, 求内推】10 年后端 | Python/Go\nFortinet math and coding test\n砖场店面后10天无消息\nRippling的纸钱到底能不能变现\n亚麻能内推已申请过的岗位吗？\nSummer intern求建议\nPinterest 27 phd mle ng\napple austin 的Enterprise Technology Services有人知道怎么样么？\nAnthropic 被拒后还有可能被捞吗\nStripe VO 和 Executive Chat 之后 被拒概率大吗\n27ng 找工求助\nUpcomi"},{"tid":1192280,"text":"Coding: 和面经里面一样chatbot 需要refactor, 唯一有点不同的是对于每个away的人，只要是有人a您好！\nnt SHA256和已有的照片一样的话，只能保持一个copy\n隔天就收到模版拒信。\nweibest\n很有用的信息！"},{"tid":1190155,"text":"iter/HR call：聊背景和期望，注意——这一轮会问你对 AGI/AI safety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immu"},{"tid":1186697,"text":"两轮，各 60 分钟，背靠背，中间完全没有休息。没有单独的 round prompt，只有 recruiter 发的那份通用的 Technical Interview Preparation PDF，大家拿到的应该都一样。\n- 第一轮 general coding：CoderPad，只支持标准库\n- 第二轮 ML coding：Google/Colab notebook，numpy / pytorch\n1/ General Coding —— Infection Spread（5 问）\n地里的经典网格模拟题。\n- 第 2 问加入 immune cells\n- 第 3 问加了 days-to-r您好！\ng>连续两个小时的真实高压状态，和自己在家 mock 完全是两回事。 我第二轮明显脑子转不动了，这种情况在之前所有模拟里一次都没发生过。\n1. 至少做一次完整的两小时 mock，而且尽量找陌生人，不要一直自己练。压力这个变量自己练是测不出来的。\n2. 两轮之间是没有缓冲的。如果第一轮感觉不好，你会直接把那个情绪带进第二轮。提前想好怎么在两轮之间给自己一个 reset。\nmlejobs"}],"posts":[{"tid":1195024,"title":"【整理，非个人面经】OpenAI 面经高频题汇总 + 我的备考笔记|openai面经","chars":5271,"floors":7,"roles":["swe"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1195024-1-1.html"},{"tid":1193826,"title":"求人类学 ml rs":6,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1186697-1-1.html"},{"tid":1182818,"title":"OAI mle/re phone screen + partial 昂赛|openai面经","chars":7215,"floors":16,"roles":["mle"],"stages":["Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1182818-1-1.html"},{"tid":1182001,"title":"开放爱昂赛面经|openai面经","chars":8790,"floors":19,"roles":["swe"],"stages":["Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1182001-1-1.html"},{"tid":1177202,"title":"求 Anthropic 4hr Take-Home Assignment 题目分享｜可以分享openai 全套面经|anthropic求职讨论","chars":9453,"floors":18,"roles":["swe"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1177202-1-1.html"},{"tid":1176223,"title":"开放爱 ml coding新题求交流|openai求职讨论","chars":2214,"floors":1,"roles":["swe"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1176223-1-1.html"},{"tid":1164743,"title":"【求教】目标 OpenAI / xAI / Anthropic，除了刷题还需要打通哪些技术栈？","chars":4522,"floors":6,"roles":["research"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1164743-1-1.html"}]},{"id":"numpy-1nn-wx-b","name":"NumPy 1-NN / Wx+B","name_en":"NumPy 1-NN / Wx+B","category":"coding","roles":["swe","mle"],"stages":["Onsite","Phone Screen"],"heat":15,"runnable":true,"frequency":"high","snippets":[{"tid":1191430,"text":"欢迎在评论区补充纠错。\n先说流程，这半年基本固定了：HR call必问AGI和AI safety咋看，答不好直接挂；然后技术电面，两轮60-75分钟连着排，一轮coding一轮SD；过了是VO，4到5轮，coding、SD、BQ、deep dive，ML岗多一轮ML coding；最后HM chat再team match。电面出结果挺快的，1-3天。注意75分钟那轮如果是ML coding，重点押numpy和数值稳定性；60分钟那轮常考autograd那套。\ncoding高频题，植物感染最热，5个部分层层递进，能做到3-4个一般能过。但注意老题被针对性改了：Q3/Q4跟外面流传的H2H版本不一样，有人用H2H的做法去面大部分test case都没过，面试官知道题泄露了。GPU Credits第二热，grant/subtract/get balance那套，过期优先级加乱序操作，followup会问生产级优化咋避免从T0重算。Monster Battle是research岗高频。Poker/Card Game今年新变体特别多，三条>同花>对子>高牌再比踢脚，9月好几篇都是这个。还有KV Store、Machine Topology、ModalLock多线程那套。infra组专属topology ma您好！\n次。HR的说法是得有1到2个spike才送HC。"},{"tid":1190831,"text":"ML coding 1: 1nn + followup (Manhattan distance)，跟地里面描述的题目基本一致\n染，跟hack2hire题目一模一样，建议直接练习上面的五问\n求大米，祝大家面试顺利！\nppendulum\nshshrosh\nweibest\n很有用的信息！"},{"tid":1190155,"text":"bug、1NN、cross-entropy、noisy annotator\n16. 2026-9-01，Research，recruiter 邮件：General Coding 偏应用统计（准备帖）\n17. 2026-9-14，ML，ML System Design mock 求队友（准备帖）\n18. 2026-9-04，ML，追问 ML coding onsite 内容：math coding、numpy、手写 miniGPT（提问帖）\n五、备考建议\n1. Coding：Plant Infection 5 部分手写一遍（grid 模拟题，练到 30 分钟内写完）；GPU Credits 的过期优先级逻辑；Text Editor 的 undo/redo 双栈。\n2. ML track：Transformer 4 个经典 bug 背下来，KV cache 手写一遍；numpy 向量化只许用向量操作。\n3. SD：Payment（幂等、对账）和 Chess.com（匹配、WebSocket）各准备一套；Sora 那套 GPU 调度能聊。\n4. ML SD：RAG 全链路 + embedding 训练细节（见本系列第 3 篇）。\n5. BQ：Why OpenAI / AGI safety 提前写好 2 分钟版本，recruiter 那轮就会问。\n6. 速度是"},{"tid":1188350,"text":"正在准备oai的ml coding的面试，总结一下目前在地里看到的OAI的面经，其中出现过的ML coding round的题有（以下不分顺序）：\nPrefix product autogradTransformer Debug + implementing KV cache1NNImplement cross ent您好！\n自己顶一下，目前还是没找到noisy annotator的notebook。收到了一些跟帖的提醒，但是很多都被删掉了。如果想联系我的话，可以直接私信我？或者随便留个言，我来联系你。多谢！\n怡然的西红柿"},{"tid":1186697,"text":"两轮，各 60 分钟，背靠背，中间完全没有休息。没有单独的 round prompt，只有 recruiter 发的那份通用的 Technical Interview Preparation PDF，大家拿到的应该都一样。\n- 第一轮 general coding：CoderPad，只支持标准库\n- 第二轮 ML coding：Google/Colab notebook，numpy / pytorch\n1/ General Coding —— Infection Spread（5 问）\n地里的经典网格模拟题。\n- 第 2 问加入 immune cells\n- 第 3 问加了 days-to-r您好！\ng>连续两个小时的真实高压状态，和自己在家 mock 完全是两回事。 我第二轮明显脑子转不动了，这种情况在之前所有模拟里一次都没发生过。\n1. 至少做一次完整的两小时 mock，而且尽量找陌生人，不要一直自己练。压力这个变量自己练是测不出来的。\n2. 两轮之间是没有缓冲的。如果第一轮感觉不好，你会直接把那个情绪带进第二轮。提前想好怎么在两轮之间给自己一个 reset。\nmlejobs"},{"tid":1182818,"text":"分享个OAI面筋，顺便求大米\n除了店面都是原题，因为过度准备题库跟得失心太重，面的很糟。很懊悔\n店面考malloc，其他人分享过，细节差别不大。一共两问：先naive first-fit解，然后讨论并简易实现best-fit\nML Coding (Prompt 为matmul + backprop)\n题目大概为一个简化版GEMM，第一部分先与考官推导基本的sharded matmul\n第二部分為用numpy/pytorch推导matmul + backprop across device。之后有捉虫环节，\n会告知有一个固定您好！\n 而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补"},{"tid":1194460,"text":"[Blind上看到的，大家自行判断]\nResumable Versioned Key-Value Store\nYou're building an in-memory key-value store used by a distributed training job to checkpoint model metadata.\nPart 1. Implement set(key, value, timestamp) and get(key, timestamp). get returns the value that was set at the closest timestamp at or before the given timestamp. Timestamps are 您好！\nthe number of versions. Thread-safe, though you may assume single-threaded access. If a key doesn't exist, return None or rai"},{"tid":1194125,"text":"coding: 老题 durable kv store. followup: split您好！\n面完觉得肯定挂了，感谢面试官放过"},{"tid":1192976,"text":"经典kvstore题，一共三问\n第一问 k,v及其对应的length都变成by您好！\n完了还剩点时间聊一聊，水一水）\n攒人品攒人品\n怡然的西红柿"},{"tid":1192085,"text":"erialize data 这题是老经典 KV 序列化题，60 分钟正常。\n使用独家折扣码 1p3acre 立享额外9折优惠！\n地里匿名用户\n2026-10-7 05:24:42\nopenAI还会提前告知题目的关键词吗\n职场新人升级通关攻略\n新人在组里如何站住脚，快速上手，迅速成长，获得认可\nintern如何拿到return offer\n地里匿名用户\n2026-10-7 02:18:34\n这不就是KV Store那题吗。。。老题了\n地里匿名用户\n2026-10-7 05:55:09\n匿名用户 发表于 2026-10-6 14:24\nopenAI还会提前告知题目的关键词吗\n会， 我是一轮60分钟simulation -> 感染\n地里匿名用户\n2026-10-7 06:36:58\n咋问关键词 或者哪里看啊 prep material里面吗\n地里匿名用户\n2026-10-7 06:40:13\n匿名用户 发表于 2026-10-06 15:36:58\n咋问关键词 或者哪里看啊 prep material里面吗\n我的case是recruiter会一句话提到这个关键词\n比如他说：下一轮面试是coding/system design, 可以准备一下xxxx相关内容\n地里匿名用户\n2026-11-4 14:56:18\n太爽了吧！ 被面到新題的入過"},{"tid":1191430,"text":"本不一样，有人用H2H的做法去面大部分test case都没过，面试官知道题泄露了。GPU Credits第二热，grant/subtract/get balance那套，过期优先级加乱序操作，followup会问生产级优化咋避免从T0重算。Monster Battle是research岗高频。Poker/Card Game今年新变体特别多，三条>同花>对子>高牌再比踢脚，9月好几篇都是这个。还有KV Store、Machine Topology、ModalLock多线程那套。infra组专属topology ma您好！\n次。HR的说法是得有1到2个spike才送HC。\n3. onsite过了也不稳，好几起feedback positi iter 的反馈？通常是几天还是一两周？\n求米，祝大家好运！\n418Teapot"},{"tid":1192550,"text":"米！\nGoogle LC - 近三個月的高頻題 - 急需大米！\n小白转码Leetcode 错题本\nLeetcode 个人打卡 10日速通版\n【面经】Stripe Coding：自行车路线规划 —— K 条最便宜的简单路径（过滤+复合成本）\n今天复习了二维dp 72. Edit Distance\n【面经】Anthropic Coding：调试 LRU 缓存的 Bug，再让它崩溃后能恢复（WAL + 快照）\n[面经] Strava Coding：海拔采样中的第一段爬升（严格版 + 容忍小幅下降）\n分享自己写的刷题插件LoopCoach：对标目标公司追踪30+知识点\n[面经] NVIDIA Coding：LRU 磁盘空间管理器（按容量淘汰）\n[面经] Meta Coding：没有地图的迷宫找奶酪（DFS + 回溯）\n[面经] Meta Coding：32 位整数按字节翻转（热身题）\n《别再按题号刷 LeetCode 了：Google 高频题的正确打开方式》\n10-17-2026 继续刷题打卡\n冷目灼灼的扁豆\n冷目灼灼的扁豆\n2026-10-11 15:26:02\n匿名用户 发表于 2026-10-10 21:28\n有这道题吗？从来没见过啊\n见过类似的变体，核心都是在线游戏 + 直播观众这套框架，具体游戏不一样，细节也可以换着考。\n使用独家折扣码 1p3"},{"tid":1192549,"text":"米！\nGoogle LC - 近三個月的高頻題 - 急需大米！\n小白转码Leetcode 错题本\nLeetcode 个人打卡 10日速通版\n【面经】Stripe Coding：自行车路线规划 —— K 条最便宜的简单路径（过滤+复合成本）\n今天复习了二维dp 72. Edit Distance\n【面经】Anthropic Coding：调试 LRU 缓存的 Bug，再让它崩溃后能恢复（WAL + 快照）\n[面经] Strava Coding：海拔采样中的第一段爬升（严格版 + 容忍小幅下降）\n分享自己写的刷题插件LoopCoach：对标目标公司追踪30+知识点\n[面经] NVIDIA Coding：LRU 磁盘空间管理器（按容量淘汰）\n[面经] Meta Coding：没有地图的迷宫找奶酪（DFS + 回溯）\n[面经] Meta Coding：32 位整数按字节翻转（热身题）\n《别再按题号刷 LeetCode 了：Google 高频题的正确打开方式》\n10-17-2026 继续刷题打卡"},{"tid":1192085,"text":"duct DS Onsite but not enough points\nBrex 2027 Summer SWE Intern Program application is open!\n地里匿名用户\n2026-10-7 16:40:17\nEMLE 部分组现在流程不一样，有的组店面只安排一轮 coding，剩下是 behavior+ML 系统讨论。serialize data 这题是老经典 KV 序列化题，60 分钟正常。\n使用独家折扣码 1p3acre 立享额外9折优惠！\n地里匿名用户\n2026-10-7 05:24:42\nopenAI还会提前告知题目的关键词吗\n职场新人升级通关攻略\n新人在组里如何站住脚，快速上手，迅速成长，获得认可\nintern如何拿到return offer\n地里匿名用户\n2026-10-7 02:18:34\n这不就是KV Store那题吗。。。老题了\n地里匿名用户\n2026-10-7 05:55:09\n匿名用户 发表于 2026-10-6 14:24\nopenAI还会提前告知题目的关键词吗\n会， 我是一轮60分钟simulation -> 感染\n地里匿名用户\n2026-10-7 06:36:58\n咋问关键词 或者哪里看啊 prep material里面吗\n地里匿名用户\n2026-10-7 06:40:13\n匿名用户 发表于"},{"tid":1192061,"text":"SWE VO\n系统设计：设计ChatGPT，一开始面试官说不要考虑scale，不需要persist。后面闻到了为什么用SSE不用websocket，还问了前端方面如何优化能让长对话渲染。\n代码：都是新题没见过，楼主python\nVector Store题目大概是实现一个简化的 vector store，支持：\nadd(index, val)\n：在指定下标插入一个字符串，原来这个位置及之后的元素都往后移一位。get(index)\n：返回指定下标的值。一开始提出了简单方案，但面试官认为效率不够。普通单向链表按下标读取需要您好！\n执行时间取任务，再开线程执行。\n问题是正常执行可以标记COMPLETED\n，但 function 抛异常时，后面的状态更新不会执行，job 一直停在PENDING\n。问题是没有异常处理\n第二问 async scheduler bug是说提交的 jobs 看起来没有实际运行\n过了两天收到据信，准备了全部开放爱的题目但遇到两道新题"}],"posts":[{"tid":1194125,"title":"OAI 电面|openai面经","chars":4157,"floors":8,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1194125-1-1.html"},{"tid":1193684,"title":"OpenAI SWE 电面面经|openai面经","chars":4967,"floors":12,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1193684-1-1.html"},{"tid":1192550,"title":"[面经] OpenAI System Design：实时 trivia 大逃杀平台","chars":3884,"floors":5,"roles":["swe"],"stages":["OA","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1192550-1-1.html"},{"tid":1192549,"title":"[面经] OpenAI Coding：内存滑动窗口会话分析（3 Parts）","chars":4921,"floors":1,"roles":["swe"],"stages":["OA","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1192549-1-1.html"},{"tid":1192085,"title":"OpenAI 店面 只有一轮coding是啥情况","chars":3624,"floors":8,"roles":["mle"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1192085-1-1.html"},{"tid":1192061,"title":"偶爱新鲜VO挂经|openai面经","chars":12236,"floors":28,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1192061-1-1.html"},{"tid":1190155,"title":"[面试经验] OpenAI面经汇总：18篇2026实战帖+高频题|openai面经","chars":6243,"floors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"},{"tid":1188919,"title":"oai挂经|openai面经","chars":11336,"floors":26,"roles":["swe"],"stages":["Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1188919-1-1.html"},{"tid":1185475,"title":"OpenAI L5 面经（挂）|openai面经","chars":8484,"floors":19,"roles":["infra"],"stages":["OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1185475-1-1.html"},{"tid":1184346,"title":"爱开放店面。。。。。|openai面经","chars":3228,"floors":6,"roles":["swe"],"stages":["Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1184346-1-1.html"},{"tid":1184287,"title":"开放爱 店面 挂经|openai面经","chars":4029,"floors":10,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1184287-1-1.html"},{"tid":1182983,"title":"热乎的oai地面|openai面经","chars":7712,"floors":17,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1182983-1-1.html"},{"tid":1182871,"title":"OpenAI Fulltime Senior SWE Phone Interview|openai面经","chars":7309,"floors":14,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1182871-1-1.html"}]},{"id":"poker-simulation","name":"扑克模拟 / 牌型比较","name_en":"Poker Simulation / Hand Ranking","category":"coding","roles":["swe"],"stages":["Onsite","Phone Screen"],"heat":12,"runnable":true,"frequency":"high","snippets":[{"tid":1197030,"text":"我的店面一开始是一个 system design、一个 coding，后来 coding 还要加面一轮。\nSystem design 是 design 那个 IoT system。 题目的要求跟地理描述的差不多。 最后的时候，还专门问了real time dashboard\n第一个 coding 一个poker game的OOD，类似monster battle，定义player， card，game，需要实现deal card， compare card根据定义的规则。最后的输出是events，game开始，player手里有什么牌，最后谁赢了，题目里有example cases\n我只做了第一问，不知道第二问是什么.\n第二个 coding 是那个infection 的题。 但是它不是按地理面经那个从简单到难一个一个展开的，上来就是 实现您好！\n- Failure handling. Handle missing readings, offline devices, and control commands that go unacknowledged.\n- Recovery. Restore deferred loads gradually once c"},{"tid":1194893,"text":"poker simulation和noisy annotator\n打牌就俩player，每人三张牌，不用傻乎乎的想着generalize人数或牌数，直接暴力比较牌您好！\n轮ml system design，一轮backend system design"},{"tid":1191430,"text":"部分层层递进，能做到3-4个一般能过。但注意老题被针对性改了：Q3/Q4跟外面流传的H2H版本不一样，有人用H2H的做法去面大部分test case都没过，面试官知道题泄露了。GPU Credits第二热，grant/subtract/get balance那套，过期优先级加乱序操作，followup会问生产级优化咋避免从T0重算。Monster Battle是research岗高频。Poker/Card Game今年新变体特别多，三条>同花>对子>高牌再比踢脚，9月好几篇都是这个。还有KV Store、Machine Topology、ModalLock多线程那套。infra组专属topology ma您好！\n次。HR的说法是得有1到2个spike才送HC。\n3. onsite过了也不稳，好几起feedback positive但没headcount/approval被挂的，还有要了reference然后挂的，HC过了原组满了要重新team match的都有。有Sr Staff面完发现组里根本没staff的HC，headcount说没就没。\n4. 冷冻期说法不一，6个月/12个月/没冷冻期的都有，可能看组看时间，别信死一年。\n5. prompt基本可以忽略，好几个面过的人说\"和prompt一点关系都没有\"，只有60/75min的时长是有效信号，别花时间押pr"},{"tid":1191082,"text":"role是 rs 遇到了新coding 题目是 card game，前三问分别是 implement 比较 三条>对子>高牌，第二问加入 三条>同花>对子>高牌, 第三问是弃牌规则（我遇到的规则跟地里的不太一样，我遇到的是不是对子就弃牌），可以用他们给的框架也可以自己重您好！\n-18 16:27 +08:00):\n友情提示 最近面试的大家可以往后push一下等等面经 最近ml 全是新题已经面到了/朋友面到了 三个新题了==\nlalalala5134"},{"tid":1190280,"text":"card game，每个人发三张牌，最后比大小，需要输出谁拿到了什么牌，然后谁胜出。part 1是三种规则，三条您好！\n时候没这么搞，就出了点小bug，导致part 2就写了code没时间测了。求米\n很有用的信息!\nshshrosh\nckc_cmu\n微信用户_vfonj"},{"tid":1188013,"text":"一年前面oai的时候被问到了当时从来没见到过的monster attack题\n今天又被问到了从来没见到过的poker simulation题\n，语法不熟练，而且comparison的规则也确实比较多，所以最后就写了第一问\n注定和oai无缘\nyonhumin\nltlltl2006"}],"posts":[{"tid":1197030,"title":"Open AI 店面|openai面经","chars":3612,"floors":5,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1197030-1-1.html"},{"tid":1196512,"title":"开放爱刚出炉烫手面经|openai面经","chars":11591,"floors":23,"roles":["research"],"stages":["OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1196512-1-1.html"},{"tid":1195031,"title":"开放爱 店面 面经|openai面经","chars":4471,"floors":10,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1195031-1-1.html"},{"tid":1194893,"title":"OAI MLE TPS 心态要好 直接写暴力解|openai面经","chars":3523,"floors":7,"roles":["mle"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1194893-1-1.html"},{"tid":1194603,"title":"OpenAI technical screening|openai面经","chars":3906,"floors":8,"roles":["swe"], nGPU Credit 类问题：围绕额度/credit 的发放、消耗和有效期做多问递进Resumable Iterator：实现一个可以中断后恢复的迭代器，一问一问往后加要求，代码会给一部分骨架In-memory Key-Value 您好！\n？你怎么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几"},{"tid":1194575,"text":"16YOE, Target Staff, 被recruiter联系的\nScreen\nCoding: GPU Credit\nSD: Powergrid monitoring and control\nCoding: Rectangle board (add rectangles + check how many rectangles on a po您好！\n前也只是个Senior，看我说完，就不疼不痒的问了几个问题，在我看来问的都很肤浅，所以我实在也不知道他会咋写feedback\n面了两次OAI都挂了，以后估计也不想再面这家公司了，太累了，简直就跟皇上选妃一样，全是玄学。希望面镜对大家有帮助\nweibest"},{"tid":1191430,"text":"g；最后HM chat再team match。电面出结果挺快的，1-3天。注意75分钟那轮如果是ML coding，重点押numpy和数值稳定性；60分钟那轮常考autograd那套。\ncoding高频题，植物感染最热，5个部分层层递进，能做到3-4个一般能过。但注意老题被针对性改了：Q3/Q4跟外面流传的H2H版本不一样，有人用H2H的做法去面大部分test case都没过，面试官知道题泄露了。GPU Credits第二热，grant/subtract/get balance那套，过期优先级加乱序操作，followup会问生产级优化咋避免从T0重算。Monster Battle是research岗高频。Poker/Card Game今年新变体特别多，三条>同花>对子>高牌再比踢脚，9月好几篇都是这个。还有KV Store、Machine Topology、ModalLock多线程那套。infra组专属topology ma您好！\n次。HR的说法是得有1到2个spike才送HC。\n3. onsite过了也不稳，好几起feedback positive但没headcount/approval被挂的，还有要了reference然后挂的，HC过了原组满了要重新team match的都有。有Sr Staff面完发现组里根本没staff的HC，headcount说没就没。"},{"tid":1191284,"text":"OpenAI 组招面经，简单回馈一下地里。\n- Coding：GPU Credit 2\n- System Design：Payment System\n店面后一周左右安排了 HM Chat，之后进 onsite。\nstrong>补充内容 (2026-09-30 12:31 +08:00):\n在评论区补充了sd的细节\nlitJordan"},{"tid":1190264,"text":"最近在准备 OpenAI 的 GPU Credit / GPU Credit II coding 题，想请教下做过这题的同学真实面试里一般做到哪一步。\n我目前理解的 baseline 是：\nadd_credit\n/subtract\n只记录 eventget_balance(t)\n时按照 logical timestamp replaysubtract 时从当时 active 的 credits 里，按 earliest expiration f您好！\nsubtract 时找 earliest-expiring grant，并不能解决每次get_balance\n从 T0 replay？60 分钟里一般实际要求做到哪一步？如果最近碰到 GPU Credit II 的同学能分享一下真实 progression / follow-up 就非常感谢了。"},{"tid":1190155,"text":"ng 偏应用统计（准备帖）\n17. 2026-9-14，ML，ML System Design mock 求队友（准备帖）\n18. 2026-9-04，ML，追问 ML coding onsite 内容：math coding、numpy、手写 miniGPT（提问帖）\n五、备考建议\n1. Coding：Plant Infection 5 部分手写一遍（grid 模拟题，练到 30 分钟内写完）；GPU Credits 的过期优先级逻辑；Text Editor 的 undo/redo 双栈。\n2. ML track：Transformer 4 个经典 bug 背下来，KV cache 手写一遍；numpy 向量化只许用向量操作。\n3. SD：Payment（幂等、对账）和 Chess.com（匹配、WebSocket）各准备一套；Sora 那套 GPU 调度能聊。\n4. ML SD：RAG 全链路 + embedding 训练细节（见本系列第 3 篇）。\n5. BQ：Why OpenAI / AGI safety 提前写好 2 分钟版本，recruiter 那轮就会问。\n6. 速度是硬指标：多位挂经都提到\"写太慢\"\"没做完 follow-up\"，限时练。"}],"posts":[{"tid":1195024,"title":"【整理，非个人面经】OpenAI 面经高频题汇总 + 我的备考笔记|openai面经","chars":5271,"floors":7,"roles":["swe"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1195024-1-1.html"},{"tid":1194575,"title":"开放爱全套挂经|openai面经","chars":5113,"floors":11,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1194575-1-1.html"},{"tid":1191430,"title":"2026年4-9月 OpenAI 面经整理：271篇扒完，Q3题库换血|openai面经","chars":8858,"floors":16,"roles":["mle"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1191430-1-1.html"},{"tid":1191284,"title":"开放爱全套|openai面经","chars":12841,"floors":33,"roles":["swe"],"stages":["Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1191284-1-1.html"},{"tid":1190702,"title":"开放爱虚拟现场设计|openai面经","chars":10158,"floors":23,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1190702-1-1.html"},{"tid":1190699,"title":"开放爱虚拟现场代码|openai面经","chars":7937,"floors":20,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1190699-1-1.html"},{"tid":1190264,"title":"OpenAI GPU Credit II 怎么优化避免每次从 T0 replay？|openai面经","chars":4275,"floors":6,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"  Match 求捞\n怎样快速拿到o和a家的面试？\n请问AI coding到底是想考什么？\n现在到底怎么样才能过面试\n找工小结 2026Q4\n【海投快淹死了, 来看看啊, 求内推】10 年后端 | Python/Go\nFortinet math and coding test\n砖场店面后10天无消息\nRippling的纸钱到底能不能变现\n亚麻能内推已申请过的岗位吗？\nSummer intern求建议\nPinterest 27 phd mle ng\napple austin 的Enterprise Technology Services有人知道怎么样么？\nAnthropic 被拒后还有可能被捞吗\nStripe VO 和 Executive Chat 之后 被拒概率大吗\n27ng 找工求助\nUpcomi"},{"tid":1192280,"text":"Coding: 和面经里面一样chatbot 需要refactor, 唯一有点不同的是对于每个away的人，只要是有人a您好！\nnt SHA256和已有的照片一样的话，只能保持一个copy\n隔天就收到模版拒信。\nweibest\n很有用的信息！"},{"tid":1190155,"text":"iter/HR call：聊背景和期望，注意——这一轮会问你对 AGI/AI safety 的看法，答不好可以直接挂。\n- 技术电面：两个 60 分钟连排，一轮 coding + 一轮 system design（顺序不定）。Coding 给 starter code 和隐藏 test case，全过测试比最优解重要，手写代码，小问题允许查一下。\n- Onsite：4–5 轮——coding（含 refactoring 环节）、system design、behavioral、technical deep dive；MLE/RE track 加 60–75 分钟 ML coding/debugging（经常是 colab notebook 形式）。\n- SD 白板用 Excalidraw。电面出结果很快（有 1 个工作日就出的，也有 3 天左右的）。\n- Onsite 通过后据说还有 hiring manager 的 technical deep dive 做 team matching（多帖说法）。\n1. Plant Infection / 细胞自动机——2026 年头号 coding 题。46 个相关讨论，Q2 就有 18+，最近 2026-09-09 还在考。5 部分递进：grid 上算 stabilize 天数、immune cell 变体、immu"}],"posts":[{"tid":1195024,"title":"【整理，非个人面经】OpenAI 面经高频题汇总 + 我的备考笔记|openai面经","chars":5271,"floors":7,"roles":["swe"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1195024-1-1.html"},{"tid":1192669,"title":"Openai 面试材料prompt|openai求职讨论","chars":2293,"floors":2,"roles":["mle"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1192669-1-1.html"},{"tid":1192280,"title":"开放爱店面|openai面经","chars":2791,"floors":4,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1192280-1-1.html"},{"tid":1191902,"title":"开放爱电面挂经|openai面经","chars":9454,"floors":22,"roles":["swe"],"stages":["Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1191902-1-1.html"},{  coding、numpy、手写 miniGPT（提问帖）\n五、备考建议\n1. Coding：Plant Infection 5 部分手写一遍（grid 模拟题，练到 30 分钟内写完）；GPU Credits 的过期优先级逻辑；Text Editor 的 undo/redo 双栈。\n2. ML track：Transformer 4 个经典 bug 背下来，KV cache 手写一遍；numpy 向量化只许用向量操作。\n3. SD：Payment（幂等、对账）和 Chess.com（匹配、WebSocket）各准备一套；Sora 那套 GPU 调度能聊。\n4. ML SD：RAG 全链路 + embedding 训练细节（见本系列第 3 篇）。\n5. BQ：Why OpenAI / AGI safety 提前写好 2 分钟版本，recruiter 那轮就会问。\n6. 速度是硬指标：多位挂经都提到\"写太慢\"\"没做完 follow-up\"，限时练。"},{"tid":1182448,"text":"给定一个大小为N x M\n的矩形网格board\n，其中每个格子都包含一个整数。玩家从顶行的格子(0, p)\n出发，目标是在到达网格底部的同时，使收集到的总分最大。从格子(i, j)\n出发，玩家可以移动到(i+1, j-1)\n（向左下方斜走）、(i+1, j)\n（向下走）、您好！\n：另外还有额外计分规则：如果连续访问的两个格子数值相同，则获得额外奖励+X\n；如果连续访问的三个格子数值严格递增，则获得额外奖励+Y"}],"posts":[{"tid":1196170,"title":"很可惜的OAI挂经|openai面经","chars":13563,"floors":32,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1196170-1-1.html"},{"tid":1194575,"title":"开放爱全套挂经|openai面经","chars":5113,"floors":11,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1194575-1-1.html"},{"tid":1191565,"title":"openai 电面|openai面经","chars":11554,"floors":30,"roles":["swe"],"stages":["Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1191565-1-1.html"},{"tid":1190155,"title":"[面试经验] OpenAI面经汇总：18篇2026实战帖+高频题|openai面经","chars":6243,"floors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"},{"tid":1182448,"title":"open ai dsa round 面经|openai面经","chars":6017,"floors":11,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1182448-1-1.html"}]},{"id":"math-reasoning-stopping-time","name":"数学推理停止时间","name_en":"Math Reasoning / Stopping Time","category":"coding","roles":["swe"],"stages":["Onsite","Phone Screen"],"heat":5,"runnable":true,"frequency":"medium","snippets":[{"tid":1184582,"text":"里如何站住脚 togradTransformer Debug + implementing KV cache1NNImplement cross ent您好！\n自己顶一下，目前还是没找到noisy annotator的notebook。收到了一些跟帖的提醒，但是很多都被删掉了。如果想联系我的话，可以直接私信我？或者随便留个言，我来联系你。多谢！\n怡然的西红柿"}],"posts":[{"tid":1192807,"title":"开放爱店面|openai面经","chars":3353,"floors":7,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1192807-1-1.html"},{"tid":1191718,"title":"OAI ML coding 面经 + 求交流的Math and Reasoning|openai面经","chars":6750,"floors":11,"roles":["swe"],"stages":["Behavioral","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1191718-1-1.html"},{"tid":1190155,"title":"[面试经验] OpenAI面经汇总：18篇2026实战帖+高频题|openai面经","chars":6243,"floors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"},{"tid":1188350,"title":"开放爱ML coding题目总结 + 求noisy annotator的notebook|openai面经","chars":10873,"floors":25,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1188350-1-1.html"}]},{"id":"job-scheduler-bug-fix","name":"任务调度器 Bug 修复","name_en":"Job Scheduler Bug Fix","category":"coding","roles":["swe"],"stages":["OA","Onsite"],"heat":4,"runnable":true,"frequency":"single","snippets":[{"tid":1192061,"text":"al)\n：在指定下标插入一个字符串，原来这个位置及之后的元素都往后移一位。get(index)\n：返回指定下标的值。一开始提出了简单方案，但面试官认为效率不够。普通单向链表按下标读取需要您好！\n执行时间取任务，再开线程执行。\n问题是正常执行可以标记COMPLETED\n，但 function 抛异常时，后面的状态更新不会执行，job 一直停在PENDING\n。问题是没有异常处理\n第二问 async scheduler bug是说提交的 jobs 看起来没有实际运行\n过了两天收到据信，准备了全部开放爱的题目但遇到两道新题\n67victor\n欢迎分享你知道的情况，会给更多积分奖励！\nyuxrose\n祝楼主一切顺利!\nweibest\n很有用的信息！"},{"tid":1186582,"text":"NG 之后第一次准备面试，从来没有 面过system design，感觉自己准备面试题的时候总觉得 有一些自己challenge自己却答不上来的点，遂把自己准备的过程和困惑发出来，希望大家讨论抛砖引玉。 （只准备了 三道最常见的面试题目前）\n1. Design Sora\n首先看了 hello interview 的design job scheduler来learn some context\n然后看了 以及H2H的solution\n感觉主要的考点有：\npriority based handlingWorker pool management (How to handle worker failure, preemption)看到目前感觉自己主要的设计思路就是两张表 (Job 存video request 所有的metadata, jobAttempt 存 每个job的所有execution），新job request进来就直接写表+写Queue（Queue按priority分成多个），有一个scheduler 专门用于和 所有的worker 通信， worker pull job from scheduler， scheduler 去queue里按priority 拿下一个job. Worker"}],"posts":[{"tid":1192061,"title":"偶爱新鲜VO挂经|openai面经","chars":12236,"floors":28,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1192061-1-1.html"},{"tid":1186582,"title":"Open AI SD 讨论帖|openai面经","chars":4184,"floors":2,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1186582-1-1.html"},{"tid":1186019,"title":"开放爱电面|openai面经","chars":6343,"floors":12,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1186019-1-1.html"},{"tid":1184859,"title":"Phone + VO + 加面，最后一轮被雷麻了|openai面经","chars":13288,"floors":33,"roles":["swe"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1184859-1-1.html"}]},{"id":"fault-tolerant-work-queue","name":"容错工作队列","name_en":"Fault-tolerant Work Queue","category":"coding","roles":["swe"],"stages":["OA","Onsite"],"heat":4,"runnable":true,"frequency":"medium","snippets":[{"tid":1191735,"text":"Coding\n1. Fault-Tolerant Work Queue -\nSolved the first part but got stuck one silly bug which took a long time but got green eventually.\nCoded up s您好！\nate me based on overall setup.\nWill I get another chance or reject? I am so nervous."},{"tid":1186158,"text":"They asked below questions in onsite technical rounds\n1) coding round - implement a work queue and its functions (reserve, complete, fail). work queue should also support time您好！\nuiter told me my design didnt go well but I was close and they had debrief.\noverall rejected\nFrimish"}],"posts":[{"tid":1192061,"title":"偶爱新鲜VO挂经|openai面经","chars":12236,"floors":28,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"ht on 的表达、对方向的清晰度会写进反馈里。别只说\"我觉得 AI 很酷\"，最好能结合自己做过的东西讲。\nRound 1：技术电话面（Phone Screen）\n形式：共享在线编辑器（类似 CoderPad），可以跑代码您好！\n有，但重心放在\"实际工程题 + 快速搭原型\"上。找几个小需求，练习 30–60 分钟内从零搭出一个前后端能跑的小应"}],"posts":[{"tid":1195205,"title":"开放爱电面|openai面经","chars":11879,"floors":21,"roles":["swe"],"stages":["Deep Dive","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1195205-1-1.html"},{"tid":1191284,"title":"开放爱全套|openai面经","chars":12841,"floors":33,"roles":["swe"],"stages":["Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1191284-1-1.html"},{"tid":1185620,"title":"OpenAI 全栈工程师（Full-Stack Engineer）面试经验分享|openai面经","chars":5972,"floors":9,"roles":["infra"],"stages":["Behavioral","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1185620-1-1.html"}]},{"id":"streaming-entropy","name":"流式计算熵","name_en":"Streaming Entropy","category":"coding","roles":["mle","research","swe"],"stages":["OA","Onsite"],"heat":3,"runnable":true,"frequency":"medium","snippets":[{"tid":1190155,"text":"Graph——快照、top-k 推荐。\n4. Monster Battle System——策略选择、复活、胜率最大化。\n5. Toy Language / 类型推断——toString、泛型推断、函数签名。\n6. Text Editor——4 部分：buffer 增删您好！\nding 汇总：prefix-product autograd、Transformer debug、1NN、cross-entropy、noisy annotator\n16. 2026-9-01，Research，recruiter 邮件：General Coding 偏应用统计（准备帖）\n17. 2026-9-14，ML，ML System Design mock 求队友（准备帖）\n18. 2026-9-04，ML，追问 ML coding onsite 内容：math coding、numpy、手写 miniGPT（提问帖）\n五、备考建议\n1. Coding：Plant Infection 5 部分手写一遍（grid 模拟题，练到 30 分钟内写完）；GPU Credits 的过期优先级逻辑；Text Editor 的 undo/redo 双栈。\n2. ML track：Transformer 4 个经典 bug 背下来，KV cache 手写一遍；numpy 向量化只许用向量"},{"tid":1178657,"text":"请问大家ml coding这个numpy puzzle是什么题呢？这个跟entropy是一道题吗？\n看到这道题出现在地里半年了但是没有描述，仅有的描述是说用numpy来解决ml谜题？.\n有没有好心人分享一下准备方向。谢谢！\nGoogle L3 Team Match 求捞\n怎样快速拿到o和a家的面试？\n请问AI coding到底是想考什么？\n现在到底怎么样才能过面试\n找工小结 2026Q4\n【海投快淹死了, 来看看啊, 求内推】10 年后端 | Python/Go\nFortinet math and coding test\n砖场店面后10天无消息\nRippling的纸钱到底能不能变现\n亚麻能内推已申请过的岗位吗？\nSummer intern求建议\nPinterest 27 phd mle ng\napple austin 的Enterprise Technology Services有人知道怎么样么？\nAnthropic 被拒后还有可能被"}],"posts":[{"tid":1190155,"title":"[面试经验] OpenAI面经汇总：18篇2026实战帖+高频题|openai面经","chars":6243,"floors":9,"roles":["mle","research"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190155-1-1.html"},{"tid":1184129,"title":"OAI电面 以及可换其他frontier|openai面经","chars":6645,"floors":15,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1184129-1-1.html"},{"tid":1178657,"title":"oai ml coding求交流numpy puzzle|openai求职讨论","chars":2071,"floors":1,"roles":["mle"],"stages":["OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1178657-1-1.html"}]},{"id":"elevator-scheduling-simulation","name":"电梯调度模拟","name_en":"Elevator Scheduling Simulation","category":"coding","roles":["swe","ds","mle"],"stages":["Phone Screen","Onsite"],"heat":3,"runnable":true,"frequency":"low","snippets":[{"tid":1195205,"text":"f the system as a combination of:\nAn e-commerce store for browsing and purchasing games.A digital entitlement system that tracks which games each您好！\nign和high level design全部cover，再开始deep dive。\nCoding:\nElevator scheduling\nPart 1.\nPart 2.\n还有Part 3，但我在Part 2就没debug完，就没看到part 3了。有代码模板：\nmodels.py:\nloop.pyfrom typing import Callablefrom animation import animatefrom models import Building, _Worlddef _is_simulation_over(world: _World) -> bool: if world.tick <= max(world.tick_to_calls.keys()): return False for elevator in world.building.elevators: if len(elevator.passengers) > 0: return Fals"},{"tid":1190302,"text":"2 08:31:47\n匿名用户 发表于 2026-9-21 17:28\n请问是直接与recruiter联系, 而不是填写refer表格吗？\n反正推荐我的人直接给几个recruiter发邮件的\n地里匿名用户\n2026-9-22 08:58:59\n匿名用户 发表于 2026-09-21 17:31:47. 1point3acres.com\n反正推荐我的人直接给几个recruiter发邮件的\n嘴唇红润的电梯\n初级农民-请到新手上路获取积分\n嘴唇红润的电梯\n2026-9-22 10:11:31\n一般情况下同一个referral是可以覆盖多个岗位的，但具体还是看公司内部系统和recruiter处理方式，不建议一次塞太多完全不相关的岗位。可以根据自己的背景先选几个高度匹配的岗位（比如2-5个），让referrer一起提交，成功率会高点。\n而且OpenAI这种级别的公司岗位竞争很激烈，refer不一定会被考虑或者拿面试。楼主最好还是针对JD调整简历，突出和岗位最相关的项目，经验。如果几个岗位方向差异比较大，建议楼主可以分别找对应方向的人或者根据岗位匹配度排序申请比较好。\n微信用户_2a63090\n微信用户_2a63090\n2026-9-24 10:38:29\n匿名用户 发表于 2026-9-21 19:25\n内部系统内推一个人只能选一个岗位。没试过同一个人推多"}],"posts":[{"tid":1196082,"title":"开放爱 新鲜面经|openai面经","chars":3862,"floors":8,"roles":["swe"],"stages":["Behavioral","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1196082-1-1.html"},{"tid":1195205,"title":"开放爱电面|openai面经","chars":11879,"floors":21,"roles":["swe"],"stages":["Deep Dive","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1195205-1-1.html"},{"tid":1190302,"title":"想请问下各位， openai 开放爱找人内推，一次能refer几个岗位呢？|openai求职讨论","chars":7934,"floors":16,"roles":["ds","mle"],"stages":["Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1190302-1-1.html"}]},{"id":"design-slack","name":"设计 Slack","name_en":"Design Slack","category":"system-design","roles":["swe","ds"],"stages":["OA","Onsite"],"heat":3,"runnable":false,"frequency":"low","snippets":[{"tid":1174423,"text":"和其他帖子一样，先是48小时完成一个关于free trial的takehome project，提交后2-3天进行电面。\n电面一共1小时:\n面试官全程严肃，时不时还回一下Slack消息，感觉有点不耐烦。\nczhang0727\nnishyyaobaozha\n欢迎分享你知道的情况，会给更多积分奖励！"},{"tid":1152850,"text":"全strong\n4轮onsite 三轮strong 最后一轮sd被给了个估计weak hire\n加面了一轮sd来了个都不是常规sd的题 是个设计算法的 毫无系统设计考点然后被挂了（外国人sre 毫不懂sd）\n这次target L5（staff）\n最难受的是我遇到了几个年纪稍长的中国人coding bq毫不为难甚至有一轮三十多分钟做完就结束\n然后我挂在了一个不到五年经验的中国人sd手下\nsd考的是slack我一直有自己的结构他经常在不有趣的地方问我问题最后反馈的是我deepdive内容不够\n我想起bq那轮中国manager皱着眉头疯狂做笔记 不停问我他笔记需要的信息的样子，最后给了strong hire真的非常感慨。\n国人为啥能放水的地方不放水，我在现司一直给国人strong hire，signal即使缺的我就补上，特别是sd这种最好办了。\n只怕是只有烙印铁拳打到自己才会有这等意识吧，本来面完非加面最后一轮感觉稳了，自己也准备好进oai努力放国人进来，甚是开心，然而这等想法戛然而止。\n我愿意以我祭旗，再次警醒下各位，放水必须要强推/近似强推（千万别写具体的area to improve）否则对于这个烙印们都无脑给stronghire的时代，只怕你身边真正的兄弟姐妹们会越来越少。\nGlucks.Wooer\nwxliuyizhe\nzyn19930413"}],"posts":[{"tid":1186687,"title":"Open AI 电面两轮|openai面经", s":["Behavioral","Deep Dive"],"heat":1,"runnable":false,"frequency":"low","snippets":[{"tid":1195024,"text":"么推动的？项目出过事故/问题吗？你怎么定位和复盘的？为什么是 OpenAI，而不是其他 AI 公司？建议提前把一个主力项目准备到能画架构、能讲取舍、能讲失败的程度。\n六、我自己的备考计划（供参考）\nCoding：每周练 2-3 个“多问递进”的小系统题（KV store、iterator、crawler 这类），限时写完 + 写测试System Design：按上面的高频题各准备一遍，重点练支付、webhook、推理服务这三类基础设施题Refactoring：找一些写得比较乱的代码练重构，先说出自己的判断再动手改，别一上来读十几分钟项目故事：一个项目讲透，准备好选型、冲突、事故三个角度的版本\n最后再强调一次：以上是公开资料的整理和我自己的备考笔记，不是我的个人面试经历，也不能保证今年的题目还是一样。欢迎面过的大佬补充和纠错，我会持续更新。也祝大家都拿到心仪的 offer！\njesse1204\n很有用的信息！"}],"posts":[{"tid":1195024,"title":"【整理，非个人面经】OpenAI 面经高频题汇总 + 我的备考笔记|openai面经","chars":5271,"floors":7,"roles":["swe"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1195024-1-1.html"}]},{"id":"light-source-sampling-mle","name":"光源采样","name_en":"Light Source Sampling","category":"coding","roles":["research"],"stages":["OA","Onsite"],"heat":1,"runnable":true,"frequency":"low","snippets":[{"tid":1196512,"text":"Research 岗，literally 刚面完第二轮的 ML coding + general coding。\n第一问让写一个随机 sample 函数，给定光源位置，输出是若干个射到平面上的点的坐标；第二问给了这个理论上的 PDF 公式，让你对比你写的 sample 函数得到的曲线是不是和这个理论 pdf 公式相近；第三您好！\n补充内容 (2026-11-14 08:14 +08:00):"}],"posts":[{"tid":1196512,"title":"开放爱刚出炉烫手面经|openai面经","chars":11591,"floors":23,"roles":["research"],"stages":["OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1196512-1-1.html"}]},{"id":"sharded-matmul-backprop-debugging","name":"分片矩阵乘反向调试","name_en":"Sharded MatMul Backprop Debugging","category":"coding","roles":["mle"],"stages":["Deep Dive","OA"],"heat":1,"runnable":true,"frequency":"low","snippets":[{"tid":1182818,"text":"分享个OAI面筋，顺便求大米\n除了店面都是原题，因为过度准备题库跟得失心太重，面的很糟。很懊悔\n店面考malloc，其他人分享过，细节差别不大。一共两问：先naive first-fit解，然后讨论并简易实现best-fit\nML Coding (Prompt 为matmul + backprop)\n题目大概为一个简化版GEMM，第一部分先与考官推导基本的sharded matmul\n第二部分為用numpy/pytorch推导matmul + backprop across device。之后有捉虫环节，\n会告知有一个固定您好！\ntrong>\n竟然还有后续，感谢国人同学们给过。之后与head of codex (Andrey)做project deep dive。面试官无敌sharp，也问的非常细。答得不好，挂了。 。 。\n不过仔细比对后跟我投的职缺好像没有对到，不知道是怎么回事。Recruiter说没有冷冻期，所以是直接投其他岗位吗？有没有OAI同学可以解惑一下\nPestoMayo\npangkai"}],"posts":[{"tid":1182818,"title":"OAI mle/re phone screen + partial 昂赛|openai面经","chars":7215,"floors":16,"roles":["mle"],"stages":["Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1182818-1-1.html"}]},{"id":"image-sharing-content-deduplication","name":"图片分享去重","name_en":"Image Sharing Content Deduplication","category":"system-design","roles":["swe"],"stages":["OA","Onsite"],"heat":1,"runnable":false,"frequency":"medium","snippets":[],"posts":[{"tid":1191735,"title":"OpenAI Tech Screen|openai面经","chars":7387,"floors":14,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1191735-1-1.html"}]},{"id":"multi-tenant-ci-cd-workflow","name":"多租户 CI/CD","name_en":"Multi-tenant CI/CD Workflow","category":"system-design","roles":["swe"],"stages":["Behavioral","Deep Dive"],"heat":1,"runnable":false,"frequency":"low","snippets":[],"posts":[{"tid":1184859,"title":"Phone + VO + 加面，最后一轮被雷麻了|openai面经","chars":13288,"floors":33,"roles":["swe"],"stages":["Behavioral","Deep Dive","OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1184859-1-1.html"}]},{"id":"real-time-ai-product-feature","name":"实时 AI 产品功能","name_en":"Real-time AI Product Feature","category":"system-design","roles":["infra"],"stages":["Behavioral","OA"],"heat":1,"runnable":false,"frequency":"single","snippets":[{"tid":1185620,"text":"轮不是走过场。你对 mission 的表达、对方向的清晰度会写进反馈里。别只说\"我觉得 AI 很酷\"，最好能结合自己做过的东西讲。\nRound 1：技术电话面（Phone Screen）\n形式：共享在线编辑器（类似 CoderPad），可以跑代码您好！\n有，但重心放在\"实际工程题 + 快速搭原型\"上。找几个小需求，练习 30–60 分钟内从零搭出一个前后端能跑的小应用。练 streaming / 实时交互。SSE、WebSocket、前端如何处理流式响应，这些在和 LLM 相关的岗位里几乎必考。准备一套和 LLM 打交道的经验（哪怕是 side project）。rate limiting、成本、prompt/响应处理、错误重试这些点很加分。想清楚\"为什么是 OpenAI\"，并且能和你自己做过的事挂上钩。练习边写边讲。沟通在每一轮都占权重。面试大方地查文档、承认不确定，这不扣分，反而显得真实、工程化。\n六、一些个人感受\n整体体验比传统大厂舒服，题目更贴近真实工作，不太有\"为了考而考\"的感觉。节奏很快，recruiter 沟通高效。他们真的在找\"能自己把一个东西从想法做到上线\"的人，而不是只会解题的人。如果你平时就喜欢动手做产品、ship 东西，会比较对味。强度不低，Full-Stack 实战那轮尤其耗精力，注意时间管理。\njoymon\n很有用的信息！\ninstant_dev\n很有用的信息！\ntomzhang\n很有用的信息！\ninstant_ops\n很有用的信息！"}],"posts":[{"tid":1185620,"title":"OpenAI 全栈工程师（Full-Stack Engineer）面试经验分享|openai面经","chars":5972,"floors":9,"roles":["infra"],"stages":["Behavioral","OA","Onsite","Phone Screen","Team Match"],"url":"https://www.1point3acres.com/bbs/thread-1185620-1-1.html"}]},{"id":"model-calibration-ace-metric","name":"模型校准 / ACE 指标","name_en":"Model Calibration / ACE Metric","category":"coding","roles":["swe"],"stages":["OA","Onsite"],"heat":1,"runnable":true,"frequency":"single","snippets":[{"tid":1182871,"text":"coding 是 infection，Hack2Hire 原题，5 问过了 4 问。整体没什么问题，面试官也说 coding 很好。\ndesign 是 c您好！\n知道是不是 interviewer calibration 的问题，还是有别的原因。有点可惜。\narielx\n欢迎分享你知道的情况，会给更多积分奖励！\nhrgjykp"}],"posts":[{"tid":1182871,"title":"OpenAI Fulltime Senior SWE Phone Interview|openai面经","chars":7309,"floors":14,"roles":["swe"],"stages":["OA","Onsite","Phone Screen"],"url":"https://www.1point3acres.com/bbs/thread-1182871-1-1.html"}]},{"id":"version-dependency","name":"版本依赖解析","name_en":"Version Dependency Resolution","category":"coding","roles":["infra","mle"],"stages":["Onsite","Phone Screen"],"heat":1,"runnable":true,"frequency":"medium","snippets":[{"tid":1194788,"text":"第一轮面试考 Systems Coding（75 min），想问下大家75分钟的面试是只考75min的那三道题吗？我看地里有malloc，version dependency，hillis scan。其他60min的题会考吗？感谢！！\n过两周面完回来分享面经。。\nGoogle L3 Team Match 求捞\n怎样快速拿到o和a家的面试？\n请问AI coding到底是想考什么？\n现在到底怎么样才能过面试\n找工小结 2026Q4\n【海投快淹死了, 来看看啊, 求内推】10 年后端 | Python/Go\nFortinet math and coding test\n砖场店面后10天无消息\nRippling的纸钱到底能不能变现\n亚麻能内推已申请过的岗位吗？\nSummer intern求建议\nPinterest 27 phd mle ng\napple austin 的Enterprise Technology Services有人知道怎么样么？\nAnthropic 被拒后还有可能被捞吗\nStripe VO 和 Execu"}],"posts":[{"tid":1194788,"title":"开放爱RE 75min Systems Coding|openai求职讨论","chars":2129,"floors":1,"roles":["infra",   run:'▶ Run',reset:'Reset',copy:'Copy',full:'Fullscreen',exit:'Exit',
  output:'Output',err:'Error',running:'Running',done:'Finished with no output',
  loadHint:'First run downloads the Python runtime (~10MB)',
  noSnip:'No excerpt captured for this question yet',fromPost:'post',
  morePosts:n=>`${n} more related posts`,floors:'floors',ch:'chars',mentions:n=>`mentioned in ${n} posts`,
  runnable:'Runnable',empty:'Nothing matches — try clearing some filters',
  f1:'Data collected from public community forum OpenAI interview posts',
  f2:'Post links point to the original forum; some content requires forum credits',
  f3:'Python runs locally in your browser (Pyodide) — no code is uploaded',
  related_n:'Related posts',snip_n:'Excerpts',freq:'Official frequency',
  catN:{coding:'Coding','system-design':'System Design',behavioral:'Behavioral',other:'Other'},
  roleN:{swe:'SWE',mle:'MLE',research:'Research',infra:'Infra',pm:'PM',ds:'DS',em:'EM',all:'General'}}
};
let LANG=(localStorage.getItem('lang')||(navigator.language||'en').toLowerCase().startsWith('zh')?'zh':'en');
const t=k=>T[LANG][k];
const catName=(c)=>T[LANG].catN[c]||c;
const roleName=(r)=>T[LANG].roleN[r]||r;
const qName=(q)=>LANG==='en'?(q.name_en||q.name):q.name;

function applyLang(){
  document.documentElement.lang = LANG==='zh'?'zh-CN':'en';
  document.querySelectorAll('#lang span').forEach(el=>
    el.classList.toggle('on', el.dataset.l===LANG));
  for(const [id,k] of [['hTitle','hTitle'],['sQ','sQ'],['sP','sP'],['sC','sC'],['sS','sS'],
      ['tHeat','heat'],['tName','name'],['tCat','cat'],['fLabel','filter'],
      ['fLine1','f1'],['fLine2','f2'],['fLine3','f3']]){
    const el=document.getElementById(id); if(el) el.textContent=t(k);
  }
  document.getElementById('hSub').textContent=t('hSub').replace('2026-11-18 23:51',D.meta.generated);
  document.getElementById('qInput').placeholder=t('q');
  document.getElementById('empty').textContent=t('empty');
  render();
}
document.querySelectorAll('#lang span').forEach(el=>{
  el.onclick=()=>{LANG=el.dataset.l;localStorage.setItem('lang',LANG);applyLang();};
});
/* ========================================= */

const state = {cat:new Set(), role:new Set(), stage:new Set(), q:'', sort:'heat', open:new Set()};

/* ---------- chips ---------- */
function buildChips(el, items, key){
  el.innerHTML = items.map(it=>{
    const id = it.id ?? it;
    const label = it.name ?? it;
    const n = it.count ?? '';
    return `<div class="chip" data-k="${key}" data-v="${id}">${label}${n!==''?`<span class="n">${n}</span>`:''}</div>`;
  }).join('');
}
buildChips(document.getElementById('catChips'), D.categories, 'cat');
const roleNames={swe:'SWE',mle:'MLE',research:'Research',infra:'Infra',pm:'PM',ds:'DS',em:'EM',all:'通用'};
buildChips(document.getElementById('roleChips'), D.roles.map(r=>({id:r.id,name:roleNames[r.id]||r.id,count:r.count})), 'role');
buildChips(document.getElementById('stageChips'), D.stages.map(s=>({id:s,name:s})), 'stage');

document.querySelectorAll('.chip').forEach(c=>{
  c.onclick=()=>{
    const k=c.dataset.k, v=c.dataset.v;
    if(state[k].has(v)){state[k].delete(v);c.classList.remove('on')}
    else{state[k].add(v);c.classList.add('on')}
    render();
  };
});

/* ---------- search / sort ---------- */
document.getElementById('qInput').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};
const fbtn=document.getElementById('fbtn'), fbody=document.getElementById('fbody');
fbtn.onclick=()=>{fbody.classList.toggle('open');fbtn.classList.toggle('open')};
document.getElementById('sort').onchange=e=>{state.sort=e.target.value;render()};

/* ---------- render ---------- */
const CATNAME={coding:'Coding','system-design':'System Design',behavioral:'Behavioral',other:'Other'};
function match(q){
  if(state.cat.size && !state.cat.has(q.category)) return false;
  if(state.role.size && !q.roles.some(r=>state.role.has(r))) return false;
  if(state.stage.size && !q.stages.some(s=>state.stage.has(s))) return false;
  if(state.q){
    const hay=(q.name+' '+(q.name_en||'')+' '+q.category+' '+q.roles.join(' ')+' '+
      (q.tags||[]).join(' ')+' '+q.posts.map(p=>p.title).join(' ')).toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
  let qs=D.questions.filter(match);
  if(state.sort==='heat') qs.sort((a,b)=>b.heat-a.heat||a.name.localeCompare(b.name,'zh'));
  else if(state.sort==='name') qs.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  else qs.sort((a,b)=>a.category.localeCompare(b.category)||b.heat-a.heat);

  document.getElementById('shown').textContent=qs.length;
  const nf=state.cat.size+state.role.size+state.stage.size;
  const fc=document.getElementById('fcount');
  if(fc) fc.textContent=nf?`(${nf})`:'';
  document.getElementById('empty').style.display=qs.length?'none':'block';

  document.getElementById('list').innerHTML=qs.map((q,i)=>{
    const hot=q.heat>=10?'hot':'';
    const roles=q.roles.map(r=>`<span class="tag">${roleName(r)}</span>`).join('');
    const stages=q.stages.map(s=>`<span class="tag">${s}</span>`).join('');
    const snips=(q.snippets||[]).map(s=>
      `<div class="snip"><span class="from">${t('fromPost')} <a href="https://www.1point3acres.com/bbs/thread-${s.tid}-1-1.html" target="_blank" rel="noopener">${s.tid}</a></span>${esc(s.text)}</div>`
    ).join('') || `<div class="snip">${t('noSnip')}</div>`;
    const posts=(q.posts||[]).slice(0,10).map(p=>
      `<div class="post"><a class="t" href="${p.url}" target="_blank" rel="noopener">${esc(p.title)}</a>
       <span class="m">${p.floors} ${t('floors')} · ${p.chars.toLocaleString()} ${t('ch')}</span></div>`
    ).join('');
    const more=(q.posts||[]).length>10?`<div class="hint">${t('morePosts')(q.posts.length-10)}</div>`:'';

    const editor = q.runnable ? `
      <div class="sec">
        <h3>${t('runtime')}</h3>
        <div class="editor-wrap">
          <div class="editor-bar"><span><span class="dot"></span>main.py</span><span>Pyodide · 浏览器本地执行</span></div>
          <textarea class="code" id="code-${q.id}" spellcheck="false">${esc(templateFor(q))}</textarea>
          <div class="runs">
            <button class="primary" onclick="runPy('${q.id}',this)">${t('run')}</button>
            <button class="ghost" onclick="resetPy('${q.id}')">${t('reset')}</button>
            <button class="ghost" onclick="copyPy('${q.id}',this)">${t('copy')}</button>
            <button class="ghost fs" onclick="fullPy('${q.id}')">${t('full')}</button>
          </div>
          <div class="out" id="out-${q.id}"></div>
        </div>
        <div class="hint">${t('loadHint')}</div>
      </div>` : '';

    return `<div class="card${state.open.has(q.id)?' open':''}" id="card-${q.id}">
      <div class="head" onclick="toggle('${q.id}',event)">
        <div class="rank ${hot}">${i+1}</div>
        <div class="body">
          <div class="title">${esc(qName(q))}</div>
          <div class="tags">
            <span class="tag cat-${q.category}">${catName(q.category)}</span>
            ${q.heat?`<span class="tag heat">${t('mentions')(q.heat)}</span>`:''}
            ${q.runnable?`<span class="tag run">${t('runnable')}</span>`:''}
            ${roles}${stages}
          </div>
          <div class="metrics">
            <span>${t('related_n')} <b>${(q.posts||[]).length}</b></span>
            <span>${t('snip_n')} <b>${(q.snippets||[]).length}</b></span>
            ${q.frequency?`<span>${t('freq')} <b>${q.frequency}</b></span>`:''}
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="sec"><h3>${t('snip')}</h3>${snips}</div>
        ${posts?`<div class="sec"><h3>${t('related')}</h3><div class="posts">${posts}</div>${more}</div>`:''}
        ${editor}
      </div>
    </div>`;
  }).join('');
}

function toggle(id,e){
  if(e && e.target.tagName==='A') return;
  const el=document.getElementById('card-'+id);
  el.classList.toggle('open');
  if(el.classList.contains('open')) state.open.add(id); else state.open.delete(id);
}

/* ---------- python ---------- */
let pyodide=null, loading=null;
function ensurePy(){
  if(pyodide) return Promise.resolve(pyodide);
  if(loading) return loading;
  loading = loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"}).then(py=>{
    pyodide=py; return py;
  });
  return loading;
}
function templateFor(q){
  const n=q.name;
  return `# ${n}
# 这是 OpenAI 面经里的原题，先写下你的思路再运行验证

import sys, io

def solve(*args, **kwargs):
    # TODO: 按题面实现
    raise NotImplementedError("先实现 solve()")

# ---- 本地测试 ----
if __name__ == "__main__":
    print("题面：${n.replace(/"/g,'')}")
    print("把思路写下来，用 assert 验证边界条件")
    # 示例：assert solve(...) == ...
    print("(改这块，然后点运行)")
`;
}
function fullPy(id){
  const w=document.querySelector('#card-'+id+' .editor-wrap');
  if(!w) return;
  w.classList.toggle('fs');
  if(w.classList.contains('fs')){
    document.body.style.overflow='hidden';
    w.querySelector('.fs').textContent=t('exit');
  }else{
    document.body.style.overflow='';
    w.querySelector('.fs').textContent=t('full');
  }
}
function resetPy(id){
  const q=D.questions.find(x=>x.id===id);
  document.getElementById('code-'+id).value=templateFor(q);
}
function copyPy(id,btn){
  const ta=document.getElementById('code-'+id);
  navigator.clipboard.writeText(ta.value).then(()=>{
    const old=btn.textContent; btn.textContent='✓'; setTimeout(()=>btn.textContent=old,1200);
  });
}
async function runPy(id,btn){
  const out=document.getElementById('out-'+id);
  const code=document.getElementById('code-'+id).value;
  out.className='out show';
  out.innerHTML=`<span class="label">${t('running')}</span>${t('loadHint')}`;
  btn.disabled=true; btn.textContent=t('running')+'…';
  try{
    const py=await ensurePy();
    py.setStdout({batched:(s)=>{}});
    const buf=[];
    py.setStdout({batched:s=>buf.push(s)});
    py.setStderr({batched:s=>buf.push(s)});
    let err=null;
    try{
      await py.runPythonAsync(code);
    }catch(e){ err=e.message||String(e); }
    const txt=buf.join('');
    out.innerHTML = (txt?`<span class="label">${t('output')}</span>${esc(txt)}`:'')
      + (err?`<span class="label">${t('err')}</span><span class="err">${esc(err)}</span>`:
         (txt?'':`<span class="ok">${t('done')}</span>`));
  }catch(e){
    out.innerHTML=`<span class="label">${t('err')}</span><span class="err">${esc(e.message||e)}</span>`;
  }finally{
    btn.disabled=false; btn.textContent=t('run');
  }
}

/* ---------- misc ---------- */
const bt=document.getElementById('backtop');
window.addEventListener('scroll',()=>{bt.classList.toggle('show',window.scrollY>600)});
bt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

applyLang();
</script>
</body>
</html>
